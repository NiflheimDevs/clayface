---
# What it does, in order:
#   1. waits for WinRM to answer
#   2. resets the built-in Administrator password to the lab password
#   3. points the NIC's DNS client at the domain controller
#   4. proves the AD domain is locatable — the DC locator SRV record must
#      resolve — before attempting the join
#   5. renames the host to its inventory name (client01, from lab.yaml) and
#      joins the forest, in one call, rebooting when done
#   6. verifies domain membership and that the secure channel actually works


- name: Join Windows workstations to the lab domain
  hosts: vms_client
  gather_facts: false
  vars:
    lab_win_admin_pass: "{{ lookup('env', 'LAB_WIN_ADMIN_PASS') | default('Admin@123', true) }}"
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('clayface', true) }}"
    lab_ad_domain: "{{ lab_domain }}.local"
    lab_ad_netbios: "{{ lab_domain | upper }}"

    # Tier-0 accounts are denied interactive and remote-interactive logon on
    # workstations. Derived from lab.yaml's per-user `tier0` flag rather than
    # written down here, so adding a second tier-0 account is one lab.yaml
    # edit.
    ad_tier0_users: >-
      {{ lab_ad.users | dict2items
         | selectattr('value.tier0', 'defined')
         | selectattr('value.tier0')
         | map(attribute='key') | list }}

    # The AD weakness toggles, from lab.yaml `ad.weaknesses`. `default({})` is
    # what makes a missing key read as "baseline"; the pre_task below is what
    # stops a typo'd key from doing the same thing silently.
    lab_ad_weak: "{{ (lab_ad | default({}, true)).weaknesses | default({}, true) }}"

    # The toggles THIS play implements — deliberately not the full seven. A
    # full list here would fail on, and warn about, toggles this play never
    # reads, which is a statement about a different playbook: W1/W3/W5/W6/W7
    # belong to ad.yml and W4's `weak_gpo_permission` to ad_gpo.yml.
    # ad_validate.yml asserts the union, so it is the play that carries the
    # union's list. This play owns W2 alone, because the local Administrators
    # grant below is the whole of what W2 changes about a workstation.
    lab_ad_weak_keys:
      - excessive_local_admin

  pre_tasks:
    # ------------------------------------------------------------
    # The contract with lab.yaml, checked before the join. `lab_ad_weak` reads
    # an absent key as "off", which is right for a toggle and wrong for a
    # typo, so a toggle this play implements that lab.yaml has dropped fails
    # here instead of being a silently disabled weakness. A key lab.yaml has
    # that no play knows is reported by ad_validate.yml, whose list is the
    # union.
    # ------------------------------------------------------------
    - name: Fail if lab.yaml's `ad.weaknesses` is unusable
      ansible.builtin.assert:
        that:
          - lab_ad_weak | length > 0
          - lab_ad_weak_keys | reject('in', lab_ad_weak) | list | length == 0
        fail_msg: >-
          lab.yaml has no `ad.weaknesses` map (or it is empty), or it does not
          declare {{ lab_ad_weak_keys | reject('in', lab_ad_weak) | join(', ') }},
          which this play implements. The seven toggles are static lab facts
          and belong in lab.yaml under `ad.weaknesses`, next to the users and
          groups they govern, not in this playbook — an absent toggle reads as
          `false`, so a dropped line is a silently disabled weakness. See
          docs/ad-identity-design.md section 13 for the list.

    # ------------------------------------------------------------
    # The DC's address is read from the inventory hostvars, not written
    # down here: terraform already read it from lab.yaml's `ip:`, and a
    # third copy in a third file is a copy that rots.
    # ------------------------------------------------------------
    - name: Fail if the inventory has no domain controller
      ansible.builtin.assert:
        that: (groups['vms_dc'] | default([])) | length > 0
        fail_msg: >-
          No domain controller in the inventory. Run playbooks/dc.yml first —
          a workstation cannot join a forest that does not exist.

    - name: Read the domain controller's address from the inventory
      ansible.builtin.set_fact:
        lab_dc_ip: "{{ hostvars[groups['vms_dc'][0]].libvirt_ip | default('') }}"

    - name: Fail if the domain controller has no static address
      ansible.builtin.assert:
        that: lab_dc_ip | length > 0
        fail_msg: >-
          {{ groups['vms_dc'][0] }} has no libvirt_ip hostvar, so this play
          has no address to point the client's DNS at. Add `ip:` under
          vm_placements.{{ groups['vms_dc'][0] }} in lab.yaml, run
          `terraform -chdir=terraform apply`, then rerun.

  tasks:
    # ------------------------------------------------------------
    # 1. Wait for the VM to boot and answer WinRM. Generous: the first boot
    #    after sysprep runs specialize and OOBE before WinRM is usable.
    # ------------------------------------------------------------
    - name: Wait for WinRM to answer (VM boot after sysprep can be slow)
      ansible.builtin.wait_for_connection:
        timeout: 900

    # ------------------------------------------------------------
    # 2. Local Administrator password. Enforced here as well as baked into
    #    the unattend, so the value in the inventory is true by construction
    #    rather than by trusting the image.
    # ------------------------------------------------------------
    - name: Set built-in Administrator password
      ansible.windows.win_user:
        name: Administrator
        password: "{{ lab_win_admin_pass }}"
        account_disabled: false
        password_never_expires: true

    # ------------------------------------------------------------
    # 3. DNS client -> the DC. REQUIRED for the join.
    #
    #    The domain is located through the DC locator SRV records
    #    (_ldap._tcp.dc._msdcs.<domain>), which live in the AD zone that only
    #    the DC hosts. DHCP hands out OPNsense, whose Unbound knows nothing
    #    about clayface.local — left alone, the join fails with a generic
    #    "the specified domain either does not exist or could not be
    #    contacted".
    #
    #    Set per host rather than through DHCP option 6 on purpose: there is
    #    no second machine to break, and it works whether or not
    #    LAB_DHCP_DNS_SERVER has been enabled in opnsense.yml.
    #
    #    Idempotent: the module compares current against desired first.
    # ------------------------------------------------------------
    - name: Point the NIC's DNS client at the domain controller
      ansible.windows.win_dns_client:
        adapter_names: "*" # all IP-enabled adapters — no alias to guess
        dns_servers:
          - "{{ lab_dc_ip }}"

    # ------------------------------------------------------------
    # 4. Prove the domain is locatable BEFORE joining. A clean failure here
    #    names the actual problem; the Win32 error from a failed join does
    #    not. Same verification idiom as dc.yml.
    #
    #    -DnsOnly forbids the NetBIOS/LLMNR fallback: without it a success
    #    can come from the local cache and prove nothing about DNS.
    #
    #    No -Server: the join resolves through the adapter's configured DNS,
    #    so that is what this has to exercise. Querying the DC directly would
    #    pass even when step 3 failed to take, and the join would then fail
    #    with an opaque Win32 error instead of here.
    # ------------------------------------------------------------
    - name: Verify the domain is locatable from the client
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $cli = (Get-DnsClientServerAddress -AddressFamily IPv4).ServerAddresses
          if ($cli -notcontains '{{ lab_dc_ip }}') {
              throw "The DNS client does not point at the domain controller: $($cli -join ', ')"
          }

          $srv = Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.{{ lab_ad_domain }}" `
                   -Type SRV -DnsOnly -ErrorAction Stop
          "SRV: $($srv.NameTarget -join ', ') port $($srv.Port -join ', ')"
          "CLI: $($cli -join ', ')"
      register: srv_check
      changed_when: false
      retries: 6
      delay: 20
      until: srv_check is succeeded

    # ------------------------------------------------------------
    # 5. Rename + join in one call.
    #
    #    hostname is the inventory name (client01, from lab.yaml), which is
    #    also what the OPNsense DHCP reservation and A record are keyed on —
    #    see playbooks/opnsense.yml. The guest boots as a random
    #    WIN-XXXXXXXXXXX after sysprep /generalize, so this is the step that
    #    makes <name>.clayface finally mean this machine.
    #
    #    domain_server is deliberately NOT set: step 4 already proved the
    #    SRV records resolve, so the join goes through the same DNS path a
    #    real one would. Pinning the DC here would paper over a broken
    #    resolver instead of failing loudly.
    #
    #    The credentials are the domain's, not the local machine's:
    #    <NETBIOS>\Administrator, which after dc.yml is the forest's own
    #    built-in Administrator (the local one carried over at promotion).
    # ------------------------------------------------------------
    - name: Rename to {{ inventory_hostname }} and join {{ lab_ad_domain }}
      microsoft.ad.membership:
        hostname: "{{ inventory_hostname }}"
        dns_domain_name: "{{ lab_ad_domain }}"
        domain_admin_user: "{{ lab_ad_netbios }}\\Administrator"
        domain_admin_password: "{{ lab_win_admin_pass }}"
        state: domain
        reboot: true
        reboot_timeout: 1200
      register: domain_join

    # The reboot above drops the connection; the module's action plugin waits
    # for it, but assert reachability before the verification task so a
    # failure is attributed to the reboot and not to the check.
    # No `when:` on this - microsoft.ad's action plugin resets
    # reboot_required to False once it has rebooted
    # (plugin_utils/_module_with_reboot.py), so gating on it never runs.
    #
    # The connection does NOT break by joining the domain, which looks like
    # it should: ansible_user is bare `Administrator` over NTLM, which still
    # authenticates against the LOCAL SAM, and LocalAccountTokenFilterPolicy=1
    # (set by the unattend's specialize pass) permits remote admin with it.
    - name: Wait for WinRM after the join reboot
      ansible.builtin.wait_for_connection:
        timeout: 900

    # ------------------------------------------------------------
    # 6. Verify membership AND that the secure channel actually works.
    #    PartOfDomain alone is a claim the guest makes about itself;
    #    Test-ComputerSecureChannel proves the machine account password in
    #    AD is good, which is what later authenticates a domain logon.
    # ------------------------------------------------------------
    - name: Verify domain membership and the secure channel
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $cs = Get-CimInstance Win32_ComputerSystem

          if (-not $cs.PartOfDomain) {
              throw "$env:COMPUTERNAME is not joined to a domain."
          }
          if ($cs.Domain -ne '{{ lab_ad_domain }}') {
              throw "Joined to '$($cs.Domain)', expected '{{ lab_ad_domain }}'."
          }
          if (-not (Test-ComputerSecureChannel)) {
              throw "The secure channel to $($cs.Domain) is broken — the machine account password is not accepted."
          }

          "Name:    $($cs.Name)"
          "Domain:  $($cs.Domain)"
          "OrgUnit: $($cs.OrganizationalUnit)"
      register: membership_check
      changed_when: false
      retries: 6
      delay: 20
      until: membership_check is succeeded

    - name: Report workstation status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ membership_check.output | first }})
          is joined to {{ lab_ad_domain }} with a working secure channel,
          resolving names through {{ lab_dc_ip }}.
          Sign in as {{ lab_ad_netbios }}\Administrator
          (password: the lab admin password).

    # ------------------------------------------------------------
    # Local Administrators. This is the hinge of the attack graph: local
    # admin on the workstation is what makes an LSASS dump possible, and it
    # is what weakness W2 widens.
    #
    # win_group_membership ADDS. It does not replace the group, so the
    # built-in Administrator (this play's own transport) and the account
    # LAPS creates both survive.
    # ------------------------------------------------------------
    - name: Grant the workstation admin group local Administrator rights
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ lab_ad_netbios }}\\{{ lab_ad.workstation.admin_group }}"
        state: present

    # --- DELIBERATE WEAKNESS: W2, excessive_local_admin ---
    #
    # With the flag on, every employee is a local administrator on this
    # workstation — the whole logon group, which nests both role groups. That
    # is the ordinary shape of this finding in the field: someone needed to
    # install something once, and adding the group was easier than adding the
    # person.
    #
    # The flag-off branch is `state: absent`, NOT a skipped task.
    # win_group_membership is additive, so a `when:` guard would leave the
    # group in local Administrators forever and the baseline would never come
    # back. The task above carries the designed set unconditionally, so
    # GG-IT-Admins and the built-in Administrator survive in both postures;
    # this task only ever touches the logon group.
    #
    # This is the local-privilege branch of the chain rather than its
    # escalation: local admin is what makes an LSASS dump and the planted
    # shares on this host reachable. Domain Admin comes from W1 and W6.
    - name: Grant the logon group local Administrator rights
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ lab_ad_netbios }}\\{{ lab_ad.workstation.logon_group }}"
        state: "{{ 'present' if lab_ad_weak.excessive_local_admin | bool else 'absent' }}"

    # ------------------------------------------------------------
    # User rights. These are per-machine LOCAL security settings, not Group
    # Policy — deliberately, because GptTmpl.inf is the only GPO home for
    # them and writing it by hand does not bump the GPO version (spec
    # section 7.3). The trade is recorded there: no inheritance, no 90-minute
    # reassertion, and a rebuilt workstation needs this play re-run.
    #
    # /areas USER_RIGHTS restricts the template to [Privilege Rights], so the
    # group-membership section of the same template CANNOT replace local
    # group membership. Dropping that flag has the same failure mode as
    # Restricted Groups.
    #
    # SeInteractiveLogonRight REPLACES the default (Users), so
    # BUILTIN\Administrators and Domain Admins must both be listed or they
    # are locked off this machine. Deny always beats allow, which is why
    # adm-hermione is denied here even though she would otherwise be allowed
    # through Domain Admins.
    #
    # SeNetworkLogonRight is deliberately untouched: narrowing it would cut
    # Ansible's WinRM access to this machine.
    # ------------------------------------------------------------
    - name: Apply the workstation logon rights
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'

          $want = @{
              'SeInteractiveLogonRight'           = @('*S-1-5-32-544',
                                                      '{{ lab_ad_netbios }}\Domain Admins',
                                                      '{{ lab_ad_netbios }}\{{ lab_ad.workstation.logon_group }}')
              'SeRemoteInteractiveLogonRight'     = @('{{ lab_ad_netbios }}\{{ lab_ad.workstation.admin_group }}')
              'SeDenyInteractiveLogonRight'       = @({% for u in ad_tier0_users %}'{{ lab_ad_netbios }}\{{ u }}', {% endfor %}'{{ lab_ad_netbios }}\{{ lab_ad.idp.bind_account }}')
              'SeDenyRemoteInteractiveLogonRight' = @({% for u in ad_tier0_users %}'{{ lab_ad_netbios }}\{{ u }}', {% endfor %}'{{ lab_ad_netbios }}\{{ lab_ad.idp.bind_account }}')
              'SeDenyNetworkLogonRight'           = @('{{ lab_ad_netbios }}\{{ lab_ad.idp.bind_account }}')
          }

          # secedit stores and exports user rights as SIDs, never names.
          # Resolve the desired names once so the drift comparison and the
          # rewritten template are in the same alphabet: comparing
          # CLAYFACE\GG-IT-Admins against *S-1-5-21-...-1106 would report
          # drift on every single run and reconfigure the machine forever.
          # A name that does not resolve throws, which is the right failure
          # for a typo'd group.
          $wantSid = @{}
          foreach ($k in $want.Keys) {
              $wantSid[$k] = @($want[$k] | ForEach-Object {
                  if ($_ -like '*S-1-*') { $_ }
                  else {
                      '*' + (New-Object System.Security.Principal.NTAccount($_)).Translate(
                          [System.Security.Principal.SecurityIdentifier]).Value
                  }
              } | Sort-Object)
          }
          $want = $wantSid

          $tmp = Join-Path $env:TEMP 'clayface-secpol.inf'
          secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "secedit /export failed ($LASTEXITCODE)" }

          # secedit exports UTF-16LE; Get-Content detects the BOM.
          $lines   = Get-Content -LiteralPath $tmp
          $current = @{}
          $inPriv  = $false
          foreach ($line in $lines) {
              if ($line -match '^\[') {
                  $inPriv = ($line -match '^\[Privilege Rights\]')
                  continue
              }
              if (-not $inPriv) { continue }
              if ($line -match '^\s*(Se\w+)\s*=\s*(.*)$') {
                  $current[$matches[1]] = @($matches[2] -split ',' |
                      ForEach-Object { $_.Trim() } | Where-Object { $_ } | Sort-Object)
              }
          }

          $drift = @()
          foreach ($k in $want.Keys) {
              $have = @($current[$k] | Sort-Object)
              $need = @($want[$k] | Sort-Object)
              if (($have -join ',') -ne ($need -join ',')) { $drift += $k }
          }
          if ($drift.Count -eq 0) { 'OK'; return }

          # Rebuild the file: keep every other right as exported, drop the
          # managed ones, and re-emit them at the END OF THE
          # [Privilege Rights] SECTION. secedit reads by section, so the
          # obvious "append after the file loop" version drops them into
          # whatever section happens to be last (normally [Version]) and
          # secedit silently ignores them. The $emitted guard covers the
          # case where [Privilege Rights] is itself the last section, which
          # is what `/areas USER_RIGHTS` normally produces.
          $out     = New-Object System.Collections.Generic.List[string]
          $inPriv  = $false
          $emitted = $false
          foreach ($line in $lines) {
              if ($line -match '^\[') {
                  if ($inPriv -and -not $emitted) {
                      foreach ($k in ($want.Keys | Sort-Object)) {
                          $out.Add("$k = " + ($want[$k] -join ','))
                      }
                      $emitted = $true
                  }
                  $inPriv = ($line -match '^\[Privilege Rights\]')
                  $out.Add($line)
                  continue
              }
              if ($inPriv -and $line -match '^\s*(Se\w+)\s*=' -and
                  $want.ContainsKey($matches[1])) { continue }
              if ($line.Trim()) { $out.Add($line) }
          }
          if ($inPriv -and -not $emitted) {
              foreach ($k in ($want.Keys | Sort-Object)) {
                  $out.Add("$k = " + ($want[$k] -join ','))
              }
              $emitted = $true
          }
          Set-Content -LiteralPath $tmp -Value $out -Encoding Unicode

          secedit /configure /db "$env:TEMP\clayface-secedit.sdb" `
              /cfg $tmp /areas USER_RIGHTS /quiet
          if ($LASTEXITCODE -ne 0) { throw "secedit /configure failed ($LASTEXITCODE)" }
          "CHANGED: $($drift -join ', ')"
      register: ws_user_rights
      changed_when: "'CHANGED' in (ws_user_rights.output | join(' '))"

# ---------------------------------------------------------------------------
# Play 2: move the machine accounts into OU=Workstations.
#
# Runs on the DC, not the workstation: microsoft.ad.computer requires the
# ActiveDirectory module on the TARGET host, and a stock Windows 11 client has
# no RSAT. It stays in this playbook rather than moving to ad.yml because
# ad.yml runs before the join, when client01$ does not exist yet.
#
# This is not cosmetic. GPOs linked to OU=Workstations are what deliver the
# workstation baseline, and a machine sitting in CN=Computers receives none
# of them.
# ---------------------------------------------------------------------------
- name: Place joined workstations in the Workstations OU
  hosts: vms_dc
  gather_facts: false

  vars:
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('clayface', true) }}"
    lab_ad_domain: "{{ lab_domain }}.local"
    ad_base_dn: "DC={{ lab_ad_domain | replace('.', ',DC=') }}"
    ad_workstations_dn: "OU=Workstations,OU={{ lab_ad.ou }},{{ ad_base_dn }}"

  tasks:
    - name: Note that no workstations were joined
      ansible.builtin.debug:
        msg: >-
          No workstation in the inventory, so there is no machine account to
          move. Run playbooks/client.yml's first play to join them.
      when: (groups['vms_client'] | default([])) | length == 0

    # microsoft.ad.computer MOVES an object it finds by `identity` when
    # `path` names a different container — no Move-ADObject needed. The `$`
    # suffix is what marks it as a computer account rather than a user.
    - name: Move each workstation's machine account into OU=Workstations
      microsoft.ad.computer:
        identity: "{{ item }}$"
        path: "{{ ad_workstations_dn }}"
        state: present
      when: (groups['vms_client'] | default([])) | length > 0
      loop: "{{ groups['vms_client'] }}"
      loop_control:
        label: "{{ item }}$"

    - name: Verify the machine accounts landed in OU=Workstations
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          # Compare the object's PARENT DN, not a prefix of its own DN: a DN
          # always starts with CN=<name>,, so a `-like 'OU=Workstations,*'`
          # guard can never match and always throws.
          foreach ($n in @({% for h in groups['vms_client'] %}'{{ h }}'{% if not loop.last %}, {% endif %}{% endfor %})) {
              $c = Get-ADComputer -Identity "$n$"
              $parent = ($c.DistinguishedName -split ',', 2)[1]
              if ($parent -ne '{{ ad_workstations_dn }}') {
                  throw "$n`$ is in $parent, not {{ ad_workstations_dn }}"
              }
              "$n`$ -> $($c.DistinguishedName)"
          }
      register: machine_ou
      changed_when: false
      when: (groups['vms_client'] | default([])) | length > 0

    - name: Report the machine account placement
      ansible.builtin.debug:
        msg: "{{ machine_ou.output }}"
      when: (groups['vms_client'] | default([])) | length > 0

# ---------------------------------------------------------------------------
# Play 3: force a policy refresh and prove the workstation policy landed.
#
# Last, and separate from play 1, because the GPOs are linked to
# OU=Workstations and only take effect once play 2 has moved the machine
# account there.
# ---------------------------------------------------------------------------
- name: Refresh and verify workstation policy
  hosts: vms_client
  gather_facts: false

  tasks:
    - name: Force a policy refresh, then wait for the LAPS policy to appear
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          gpupdate /force /target:computer | Out-Null

          # The machine's own DN comes from the Group Policy engine's state,
          # NOT from Win32_ComputerSystem.OrganizationalUnit: that property
          # is empty on a joined Windows 11 client, so a check against it can
          # never pass. The GP state value is the same one gpresult reads.
          $gpState = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Group Policy\State\Machine'
          function Get-MachineDn {
              (Get-ItemProperty $gpState -Name 'Distinguished-Name' `
                  -ErrorAction SilentlyContinue).'Distinguished-Name'
          }

          $deadline = (Get-Date).AddMinutes(5)
          do {
              $laps = Test-Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LAPS'
              $dn   = Get-MachineDn
              if ($laps -and $dn -like '*,OU=Workstations,*') { break }
              Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)

          if ($dn -notlike '*,OU=Workstations,*') {
              throw "Machine account is not in OU=Workstations: '$dn'"
          }
          if (-not $laps) {
              throw 'The LAPS policy did not land. Is WS - LAPS linked to OU=Workstations?'
          }
          # The registry policy store is the honest signal: it only exists
          # because the GPO was applied, unlike the ActiveStore firewall
          # profiles, which are enabled by default anyway.
          "OrgUnit: $dn"
          "LAPS policy: present"
          "PasswordAgeDays: $((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LAPS').PasswordAgeDays)"
      register: policy_landing
      changed_when: false

    - name: Report workstation policy status
      ansible.builtin.debug:
        msg: "{{ policy_landing.output }}"
