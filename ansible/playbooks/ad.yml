---
# The AD identity layer: OUs, groups, users, account policy, the LAPS schema
# and its OU permissions, and the IDP01 directory delegation.
#
# Design: docs/ad-identity-design.md

- name: Build the AD identity layer
  hosts: vms_dc
  gather_facts: false

  vars:
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('clayface', true) }}"
    lab_ad_domain: "{{ lab_domain }}.local"
    lab_ad_netbios: "{{ lab_domain | upper }}"
    lab_user_pass: "{{ lookup('env', 'LAB_USER_PASS') | default('Passw0rd!Lab', true) }}"

    # Derived from the forest name, never written down twice.
    ad_base_dn: "DC={{ lab_ad_domain | replace('.', ',DC=') }}"
    ad_anchor_dn: "OU={{ lab_ad.ou }},{{ ad_base_dn }}"

    # The AD weakness toggles, from lab.yaml `ad.weaknesses`. `default({})` is
    # what makes a missing key read as "baseline"; the pre_task below is what
    # stops a typo'd key from doing the same thing silently.
    lab_ad_weak: "{{ (lab_ad | default({}, true)).weaknesses | default({}, true) }}"

    # The toggles THIS play implements — deliberately not the full seven. A
    # full list here would fail on, and warn about, toggles this play never
    # reads, which is a statement about a different playbook: W2's
    # `excessive_local_admin` belongs to client.yml and W4's
    # `weak_gpo_permission` to ad_gpo.yml. ad_validate.yml asserts the union,
    # so it is the play that carries the union's list.
    lab_ad_weak_keys:
      - kerberoastable_idp_bind
      - excessive_laps_read
      - unconstrained_delegation
      - excessive_idp_directory_permissions
      - excessive_group_membership

  # ------------------------------------------------------------
  # The contract with lab.yaml, checked before anything touches the
  # directory. `lab_ad_weak` reads an absent key as "off", which is right for
  # a toggle and wrong for a typo — so the failure has two sides, and this
  # guard is one side of it: a toggle this play implements that lab.yaml has
  # dropped would otherwise be a silently disabled weakness. The other side —
  # a key lab.yaml has that no play knows — is reported by ad_validate.yml,
  # whose list is the union.
  # ------------------------------------------------------------
  pre_tasks:
    - name: Fail if lab.yaml's `ad.weaknesses` is unusable
      ansible.builtin.assert:
        that:
          - lab_ad_weak | length > 0
          - lab_ad_weak_keys | reject('in', lab_ad_weak) | list | length == 0
        fail_msg: >-
          lab.yaml has no `ad.weaknesses` map (or it is empty), or it does not
          declare {{ lab_ad_weak_keys | reject('in', lab_ad_weak) | join(', ') }},
          which this play implements. The seven toggles are static lab facts
          and belong in lab.yaml under `ad.weaknesses`, next to the users and
          groups they govern, not in this playbook — an absent toggle reads as
          `false`, so a dropped line is a silently disabled weakness. See
          docs/ad-identity-design.md section 13 for the list.

  tasks:
    - name: Fail if lab.yaml has no usable `ad` section
      ansible.builtin.assert:
        that:
          - lab_ad is defined
          - lab_ad.ou is defined
          - lab_ad.users | default({}) | length > 0
        fail_msg: >-
          lab.yaml has no `ad` section (or it is empty), so this play has
          nothing to build. See docs/ad-identity-design.md.

    - name: Create the anchor OU
      microsoft.ad.ou:
        name: "{{ lab_ad.ou }}"
        path: "{{ ad_base_dn }}"
        description: Clayface lab objects (docs/ad-identity-design.md)
        protect_from_deletion: true
        state: present

    - name: Create the child OUs
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "{{ ad_anchor_dn }}"
        protect_from_deletion: true
        state: present
      loop: "{{ lab_ad.ous }}"

    - name: Read back the OU distinguished names
      ansible.windows.win_powershell:
        script: |
          Import-Module ActiveDirectory
          $dn = @{}
          $dn['{{ lab_ad.ou }}'] = '{{ ad_anchor_dn }}'
          foreach ($n in @({% for o in lab_ad.ous %}'{{ o }}'{% if not loop.last %}, {% endif %}{% endfor %})) {
              $dn[$n] = "OU=$n,{{ ad_anchor_dn }}"
          }
          $dn | ConvertTo-Json -Compress
      register: ad_ou_dn_raw
      changed_when: false

    - name: Register the OU distinguished names as a fact
      ansible.builtin.set_fact:
        ad_ou_dn: "{{ ad_ou_dn_raw.output | first | from_json }}"

    - name: Report the OU tree
      ansible.builtin.debug:
        msg: "{{ ad_ou_dn }}"

    - name: Create the security groups
      microsoft.ad.group:
        name: "{{ item.key }}"
        scope: global
        category: security
        description: "{{ item.value.description }}"
        path: "{{ ad_ou_dn.Groups }}"
        state: present
      loop: "{{ lab_ad.groups | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Additive, not `set`: a group that someone added a member to is exactly
    # what weakness W7 looks like, and ad_validate.yml is what notices. A
    # `set` would silently repair the drift instead.
    # `path` is required even though the group already exists: the module's
    # default lookup path is the well-known CN=Users container, so without it
    # it does not find a group in OU=Groups and fails its `scope` precondition
    # with "scope must be set when state=present and the group does not exist".
    - name: Nest the role groups into their parent groups
      microsoft.ad.group:
        name: "{{ item.0.key }}"
        path: "{{ ad_ou_dn.Groups }}"
        members:
          add: "{{ item.1 }}"
        state: present
      loop: "{{ lab_ad.groups | dict2items
        | selectattr('value.nested', 'defined') | list
        | subelements('value.nested') }}"
      loop_control:
        label: "{{ item.1 }} -> {{ item.0.key }}"

    # update_password: on_create, not always. Re-asserting the password on
    # every deploy would reset pwdLastSet each time and quietly undo any
    # credential change a scenario depends on. The password still comes from
    # the environment, so a fresh lab gets a known one; an existing one keeps
    # whatever it has.
    #
    # A user may name its own password environment variable with
    # `password_env:` in lab.yaml. Only svc-app-portal does: APP01 plants that
    # credential in its config and in its database, so the account has to be
    # rotatable without touching the human accounts, and the planted copy and
    # the real one have to be the same string. When the variable is unset the
    # account falls back to the shared lab password like everyone else.
    #
    # groups.add is additive for the same reason the nesting is: membership
    # drift is a finding, not something to repair silently.
    - name: Create the lab user accounts
      microsoft.ad.user:
        name: "{{ item.key }}"
        sam_account_name: "{{ item.key }}"
        upn: "{{ item.key }}@{{ lab_ad_domain }}"
        path: "{{ ad_ou_dn[item.value.ou] }}"
        description: "{{ item.value.description }}"
        password: >-
          {{ (lookup('env', item.value.password_env) | default(lab_user_pass, true))
             if item.value.password_env is defined else lab_user_pass }}
        update_password: on_create
        enabled: true
        groups:
          add: "{{ item.value.groups | default([]) }}"
        state: present
      loop: "{{ lab_ad.users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    # --- DELIBERATE WEAKNESS: W1, kerberoastable_idp_bind ---
    #
    # A service account holding a Service Principal Name is Kerberoastable: any
    # authenticated principal in the forest may request a TGS for it, the
    # ticket is encrypted with the account's own key, and it can be taken away
    # and cracked offline. No SPN means no ticket to request, which is why the
    # flag-off branch REMOVES the SPN rather than merely not adding it.
    #
    # `setspn -S` refuses to write an SPN that is already held by another
    # account, so it cannot create a duplicate; `setspn -D` removes one and is
    # only reached when the SPN is present, which is what keeps both branches
    # idempotent. The read is the idempotency key.
    #
    # The password half of W1 is not a delta and is not created here: the
    # account is created with LAB_USER_PASS (the single shared human password,
    # section 14) and the domain policy sets MaxPasswordAge 0, so it never
    # rotates. That is what makes the captured ticket worth cracking, and it is
    # why W1 needs no second change to be exploitable.
    - name: Set the SPN that makes the IDP bind account Kerberoastable
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'

          $account = '{{ lab_ad.idp.bind_account }}'
          $spn     = '{{ lab_ad.idp.spn }}'
          $want    = [bool]${{ lab_ad_weak.kerberoastable_idp_bind | bool | ternary('true', 'false') }}

          $cur = @(setspn -L $account 2>$null |
                     Select-Object -Skip 1 |
                     ForEach-Object { $_.Trim() } |
                     Where-Object { $_ })
          $has = $cur -contains $spn
          if ($has -eq $want) { 'OK'; return }

          if ($want) { setspn -S $spn $account | Out-Null }
          else       { setspn -D $spn $account | Out-Null }
          if ($LASTEXITCODE -ne 0) { throw "setspn failed ($LASTEXITCODE) for $spn on $account" }
          "CHANGED: $account SPN '$spn' -> $want"
      register: idp_spn
      changed_when: "'CHANGED' in (idp_spn.output | join(' '))"

    # --- DELIBERATE WEAKNESS: W7, excessive_group_membership ---
    #
    # The portal's service account is a member of the all-employees group,
    # which is the group that carries SeInteractiveLogonRight on the
    # workstations (client.yml). The consequence is the chain's hinge: the
    # credential the portal database hands over becomes an interactive logon
    # on a domain workstation instead of a credential that can only bind
    # LDAP. Without W7 the recovered credential cannot log on anywhere, and
    # the DMZ boundary — tcp 389/636 to dc01 and nothing else — stops the
    # attacker there.
    #
    # The finding, as an administrator would have made it: the account was
    # added to the group so it could reach a share, and nobody revisited it.
    #
    # Explicit membership rather than microsoft.ad.user's `groups.add`, because
    # the flag-off branch has to REMOVE: `add` is additive and a skipped task
    # would leave the account in the group forever. The existence check runs
    # first so a typo'd name fails with the name in the message instead of
    # adding nothing and reporting success.
    - name: Set the service account's membership of the logon group
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $group  = '{{ lab_ad.workstation.logon_group }}'
          $member = '{{ lab_ad.workstation.weak_logon_member }}'
          $want   = [bool]${{ lab_ad_weak.excessive_group_membership | bool | ternary('true', 'false') }}

          if (-not (Get-ADUser $member -ErrorAction SilentlyContinue)) {
              throw "lab.yaml names '$member' as the W7 logon-group member, but no such account exists. Check ad.workstation.weak_logon_member and ad.users."
          }

          $have = @(Get-ADGroupMember $group | Select-Object -ExpandProperty SamAccountName)
          $is   = $have -contains $member
          if ($is -eq $want) { 'OK'; return }

          if ($want) { Add-ADGroupMember -Identity $group -Members $member }
          else       { Remove-ADGroupMember -Identity $group -Members $member -Confirm:$false }
          "CHANGED: $group member '$member' -> $want"
      register: ad_weak_logon_member
      changed_when: "'CHANGED' in (ad_weak_logon_member.output | join(' '))"

    # Read-compare-write in one script: the cmdlet has no idempotency of its
    # own, and this is the same "the read is the idempotency key" idiom
    # dc.yml uses for the DNS forwarder.
    #
    # LockoutThreshold 0 (disabled) is a deliberate deviation, documented in
    # docs/ad-identity-design.md section 14: in AD the built-in
    # Administrator CAN be locked out, and Administrator is the Ansible
    # transport. The enablement recipe is in section 5.1.
    #
    # MaxPasswordAge needs care: AD encodes "never expires" as a zero
    # interval, and the cmdlet surfaces that as either TimeSpan.Zero or a
    # sentinel-sized value depending on version. Both are normalised to 0
    # here so the comparison does not drift on a value that never changes.
    - name: Set the domain account policy
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $want = @{
              MinPasswordLength           = 12
              ComplexityEnabled           = $true
              PasswordHistoryCount        = 24
              MaxPasswordAge              = 0
              MinPasswordAge              = 1
              ReversibleEncryptionEnabled = $false
              LockoutThreshold            = 0
          }

          $p = Get-ADDefaultDomainPasswordPolicy
          $curMaxAge = if ($p.MaxPasswordAge -eq [TimeSpan]::Zero -or
                          $p.MaxPasswordAge.TotalDays -ge 9999) {
              0
          } else { [int]$p.MaxPasswordAge.TotalDays }

          $cur = @{
              MinPasswordLength           = $p.MinPasswordLength
              ComplexityEnabled           = $p.ComplexityEnabled
              PasswordHistoryCount        = $p.PasswordHistoryCount
              MaxPasswordAge              = $curMaxAge
              MinPasswordAge              = [int]$p.MinPasswordAge.TotalDays
              ReversibleEncryptionEnabled = $p.ReversibleEncryptionEnabled
              LockoutThreshold            = $p.LockoutThreshold
          }

          $drift = @($want.Keys | Where-Object { $want[$_] -ne $cur[$_] })
          if ($drift.Count -eq 0) { 'OK'; return }

          Set-ADDefaultDomainPasswordPolicy -Identity '{{ lab_ad_domain }}' `
              -MinPasswordLength $want.MinPasswordLength `
              -ComplexityEnabled $want.ComplexityEnabled `
              -PasswordHistoryCount $want.PasswordHistoryCount `
              -MaxPasswordAge (New-TimeSpan -Days $want.MaxPasswordAge) `
              -MinPasswordAge (New-TimeSpan -Days $want.MinPasswordAge) `
              -ReversibleEncryptionEnabled $want.ReversibleEncryptionEnabled `
              -LockoutThreshold $want.LockoutThreshold
          "CHANGED: $($drift -join ', ')"
      register: ad_account_policy
      changed_when: "'CHANGED' in (ad_account_policy.output | join(' '))"

    # ---------------------------------------------------------------
    # LAPS. The schema extension is a forest-wide, one-way operation, so it
    # is guarded on a schema check rather than run blind on every deploy.
    # Verified against Microsoft's LAPS schema reference: a new Server 2025
    # forest has the LAPS *client* but NOT the msLAPS-* attributes — those
    # still require Update-LapsADSchema.
    # ---------------------------------------------------------------
    - name: Check whether the LAPS schema is already extended
      ansible.windows.win_powershell:
        script: |
          Import-Module ActiveDirectory
          $root = (Get-ADRootDSE).schemaNamingContext
          # lDAPDisplayName, not name: schema attribute objects do not carry
          # a `name` value, so a (name=...) filter matches nothing and this
          # guard is permanently false - which would re-run a forest-wide,
          # one-way schema extension on every single deploy.
          $attr = Get-ADObject -SearchBase $root `
                    -LDAPFilter '(lDAPDisplayName=msLAPS-Password)' `
                    -Properties lDAPDisplayName -ErrorAction SilentlyContinue
          if ($attr) { 'PRESENT' } else { 'ABSENT' }
      register: laps_schema
      changed_when: false

    - name: Extend the AD schema for Windows LAPS
      ansible.windows.win_powershell:
        script: |
          Update-LapsADSchema -Confirm:$false | Out-Null
          'CHANGED'
      when: "'PRESENT' not in (laps_schema.output | join(' '))"
      changed_when: true

    # `Import-Module ActiveDirectory` is not decoration: the AD: PSDrive is
    # registered by that module, and module autoloading fires on cmdlet
    # discovery, not on provider-path resolution. Without it this fails with
    # "Cannot find drive. A drive with the name 'AD' does not exist."
    #
    # The guard must match the LAPS attribute by schemaIDGUID, not just look
    # for "a SELF ACE with an extended right". Every OU inherits a SELF ACE
    # from the domain root's default security descriptor, so the coarse form
    # matches on an OU this task has never touched, reports OK, and leaves the
    # workstation unable to write its own password - a failure that only shows
    # up later, as LAPS silently never rotating.
    - name: Let computers in OU=Workstations store their own LAPS password
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $ou = '{{ ad_ou_dn.Workstations }}'
          $schema = (Get-ADRootDSE).schemaNamingContext
          $attr = Get-ADObject -SearchBase $schema `
                    -LDAPFilter '(lDAPDisplayName=msLAPS-Password)' `
                    -Properties schemaIDGUID
          # No pipeline here: schemaIDGUID is already a 16-byte array, and
          # piping it enumerates the bytes, handing the Guid constructor a
          # single byte.
          $want = [Guid]::new([byte[]]$attr.schemaIDGUID)
          $has = (Get-Acl -Path "AD:\$ou").Access |
              Where-Object { $_.IdentityReference -like '*SELF' -and
                             $_.AccessControlType -eq 'Allow' -and
                             $_.ObjectType -eq $want }
          if ($has) { 'OK'; return }
          Set-LapsADComputerSelfPermission -Identity $ou -Confirm:$false
          'CHANGED'
      register: laps_self
      changed_when: "'CHANGED' in (laps_self.output | join(' '))"

    # Requires BOTH this right and membership of the decryption principal
    # configured in the LAPS policy (task 10) — ADPasswordEncryptionPrincipal
    # is GG-IT-Admins. Two independent gates, which is why weakness W3 has
    # two ways to be introduced.
    - name: Let the workstation admins read LAPS passwords on OU=Workstations
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $ou     = '{{ ad_ou_dn.Workstations }}'
          $who    = '{{ lab_ad_netbios }}\{{ lab_ad.workstation.admin_group }}'
          $has = (Get-Acl -Path "AD:\$ou").Access |
              Where-Object { $_.IdentityReference -eq $who -and
                             $_.ActiveDirectoryRights -match 'ExtendedRight' }
          if ($has) { 'OK'; return }
          Set-LapsADReadPasswordPermission -Identity $ou -AllowedPrincipals $who -Confirm:$false
          'CHANGED'
      register: laps_read
      changed_when: "'CHANGED' in (laps_read.output | join(' '))"

    # Read-only, scoped to exactly the OUs named in lab.yaml, inherited to
    # their descendants. Everything outside that scope is denied by
    # omission — OU=Workstations (where the confidential LAPS attributes
    # live), OU=ServiceAccounts, and the domain root itself.
    #
    # GenericRead is the LDAP read right, not a filesystem right: it covers
    # list contents and read properties, which is what a directory sync and
    # an LDAP search need.
    #
    # Why not dsacls: its /I: inheritance flags are easy to get backwards and
    # the failure is silent. ActiveDirectorySecurityInheritance::All states
    # "this object and all descendants" unambiguously in the code.
    - name: Grant the IDP bind account read-only access to its scoped OUs
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          Add-Type -AssemblyName System.DirectoryServices

          $who = '{{ lab_ad.idp.bind_account }}'
          $sid = (New-Object System.Security.Principal.NTAccount(
                    '{{ lab_ad_netbios }}', $who)
                 ).Translate([System.Security.Principal.SecurityIdentifier])

          $wantOus = @({% for o in lab_ad.idp.read_ous %}'{{ ad_ou_dn[o] }}'{% if not loop.last %}, {% endif %}{% endfor %})
          $changed = @()

          foreach ($ou in $wantOus) {
              $acl = Get-Acl -Path "AD:\$ou"
              $has = $acl.Access | Where-Object {
                  $_.IdentityReference.Translate(
                      [System.Security.Principal.SecurityIdentifier]) -eq $sid -and
                  $_.AccessControlType -eq 'Allow' -and
                  $_.ActiveDirectoryRights -match 'GenericRead'
              }
              if ($has) { continue }

              $rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
                  $sid,
                  [System.DirectoryServices.ActiveDirectoryRights]::GenericRead,
                  [System.Security.AccessControl.AccessControlType]::Allow,
                  [System.DirectoryServices.ActiveDirectorySecurityInheritance]::All)
              $acl.AddAccessRule($rule)
              Set-Acl -Path "AD:\$ou" -AclObject $acl
              $changed += $ou
          }

          if ($changed.Count -eq 0) { 'OK' }
          else { "CHANGED: $($changed -join '; ')" }
      register: idp_delegation
      changed_when: "'CHANGED' in (idp_delegation.output | join(' '))"

    # --- DELIBERATE WEAKNESS: W6, excessive_idp_directory_permissions ---
    #
    # The two extended rights that together are DCSync, granted on the DOMAIN
    # ROOT: Replicating Directory Changes and Replicating Directory Changes
    # All. A principal holding both can ask a domain controller to replicate
    # the password hashes over DRSUAPI — including krbtgt's, which is a
    # Domain Admin by way of a forged golden ticket. This is the escalation
    # half of the Chapter 5 chain.
    #
    # The rights are matched by their schema GUIDs rather than by name because
    # that is what the ACE stores and what a reader of the ACL has to look
    # for. Both are needed: the first alone replicates non-secret attributes.
    #
    # Why a real organization has this: directory-sync products (Azure AD
    # Connect, backup agents, monitoring) genuinely need it, the vendor's
    # install guide says to grant it, and nobody narrows it afterwards.
    #
    # The flag-off branch builds the SAME rule object and removes it with
    # RemoveAccessRuleSpecific, which requires an exact match — including
    # inheritance flags — so it cannot strip an unrelated delegation.
    # RemoveAccessRule is the looser variant and deliberately not used.
    #
    # This is deliberately NOT scoped to the read OUs the way the ACE above
    # is. Replication rights are a property of the naming context, not of a
    # subtree, so a grant that looked scoped would not replicate anything and
    # would be a weakness in appearance only.
    - name: Grant the IDP bind account the DCSync replication rights
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          Add-Type -AssemblyName System.DirectoryServices

          $who  = '{{ lab_ad.idp.bind_account }}'
          $sid  = (New-Object System.Security.Principal.NTAccount(
                    '{{ lab_ad_netbios }}', $who)
                 ).Translate([System.Security.Principal.SecurityIdentifier])
          $want = [bool]${{ lab_ad_weak.excessive_idp_directory_permissions | bool | ternary('true', 'false') }}

          # Replicating Directory Changes (1131f6aa-...) and Replicating
          # Directory Changes All (1131f6ad-...).
          $guids = @(
              [Guid]'1131f6aa-9c07-11d1-f79f-00c04fc2dcd2',
              [Guid]'1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
          )

          $acl  = Get-Acl -Path 'AD:\{{ ad_base_dn }}'
          $mine = @($acl.Access | Where-Object {
              if ($_.IsInherited) { return $false }
              try {
                  $_.IdentityReference.Translate(
                      [System.Security.Principal.SecurityIdentifier]).Value -eq $sid.Value
              } catch { return $false }
          })
          $changed = @()

          foreach ($g in $guids) {
              $has = @($mine | Where-Object {
                  $_.AccessControlType -eq 'Allow' -and
                  $_.ActiveDirectoryRights -match 'ExtendedRight' -and
                  $_.ObjectType -eq $g
              }).Count -gt 0
              if ($has -eq $want) { continue }

              $rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
                  $sid,
                  [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight,
                  [System.Security.AccessControl.AccessControlType]::Allow,
                  $g)
              if ($want) { $acl.AddAccessRule($rule) }
              else       { $acl.RemoveAccessRuleSpecific($rule) | Out-Null }
              $changed += "$g=$want"
          }

          if ($changed.Count -eq 0) { 'OK' }
          else {
              Set-Acl -Path 'AD:\{{ ad_base_dn }}' -AclObject $acl
              "CHANGED: $($changed -join ', ')"
          }
      register: ad_dcsync
      changed_when: "'CHANGED' in (ad_dcsync.output | join(' '))"
