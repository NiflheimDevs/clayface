---
# Configures the hypervisors: L2 segments, the overlay that carries them
# between hosts, and each segment's monitoring address and resolver.
#
# Everything it creates is derived from lab.yaml's `networks:` map, published
# by inventory/lab_inventory.py as `lab_networks` on every host. The map is
# the only place a bridge name is written down; before this, the playbook had
# its own copy and the terraform modules had six literals of their own, with
# nothing linking them.
#
# Note what this playbook does NOT do: it never asks terraform anything. It
# reads lab.yaml through the inventory, so it can run before `terraform
# apply` - which is what deploy.sh now does, because a VM whose bridge does
# not exist yet fails at domain start with "Network bridge <name> not found".
- name: Configure hypervisor hosts
  hosts: hypervisors
  become: true

  tasks:
    # ------------------------------------------------------------
    # Packages
    # ------------------------------------------------------------

    - name: Install libvirt and QEMU
      ansible.builtin.package:
        name:
          - libvirt
          - qemu-desktop
        state: present

    # ------------------------------------------------------------
    # libvirt
    # ------------------------------------------------------------

    - name: Enable and start libvirtd
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started

    # ------------------------------------------------------------
    # L2 segments: one bridge per entry in lab.yaml `networks:`
    # ------------------------------------------------------------
    # `bridge` is the only required key, so this loop covers the WAN leg -
    # which declares nothing but a bridge - as well as the routed segments.
    # A segment declaring no `vxlan_id` is host-local by definition; see the
    # overlay section below.

    - name: Read the host's links
      ansible.builtin.command:
        cmd: ip -j link show
      register: host_links
      changed_when: false

    - name: Create the segment bridges that are missing
      ansible.builtin.command:
        cmd: "ip link add name {{ item.value.bridge }} type bridge"
      loop: "{{ lab_networks | dict2items }}"
      loop_control:
        label: "{{ item.key }} ({{ item.value.bridge }})"
      when: item.value.bridge not in host_links.stdout | from_json | map(attribute='ifname')

    - name: Re-read the host's links
      ansible.builtin.command:
        cmd: ip -j link show
      register: host_links
      changed_when: false

    # The administrative-up test reads the IFF_UP flag rather than the
    # operstate: an empty bridge reports `state DOWN` even when it is up,
    # because it has no port with carrier. Testing operstate would report a
    # change on every run forever.
    - name: Bring up the segment bridges that are down
      ansible.builtin.command:
        cmd: "ip link set dev {{ item.value.bridge }} up"
      loop: "{{ lab_networks | dict2items }}"
      loop_control:
        label: "{{ item.key }} ({{ item.value.bridge }})"
      when: >-
        'UP' not in (host_links.stdout | from_json
                     | selectattr('ifname', 'equalto', item.value.bridge)
                     | first).flags

    # ------------------------------------------------------------
    # Control-node address on each segment that declares one
    # ------------------------------------------------------------
    # The hypervisor is a member of every zone. That is a provisioning fact
    # outside the attacker model rather than a hole in the boundary: what a
    # segment boundary governs is VM-to-VM traffic, and the attacker in this
    # lab never holds the hypervisor. Without an address here the control
    # node could not reach app01 once app01 sits on its own segment.

    - name: Read each segment bridge's addresses
      ansible.builtin.command:
        cmd: "ip addr show dev {{ item.value.bridge }}"
      loop: "{{ lab_networks | dict2items }}"
      register: bridge_addrs
      changed_when: false

    - name: Give the control node an address on every segment that declares one
      ansible.builtin.command:
        cmd: "ip addr add {{ item.item.value.monitor }} dev {{ item.item.value.bridge }}"
      loop: "{{ bridge_addrs.results }}"
      loop_control:
        label: "{{ item.item.key }} ({{ item.item.value.bridge }})"
      when:
        - item.item.value.monitor is defined
        - item.item.value.monitor not in item.stdout

    # ------------------------------------------------------------
    # DNS on each segment
    # ------------------------------------------------------------
    # The `clayface` zone is served by OPNsense (Unbound -> dnsmasq) on the
    # LAN leg. The machine's other resolvers have never heard of it, so
    # without this the Ansible VM inventory cannot resolve its own
    # `ansible_host` (`<name>.<domain>` from terraform_vms.py) and every VM
    # playbook dies with NameResolutionError. Scoped per link: queries are
    # asked of the segment's resolver *in addition to* the normal resolvers,
    # not instead of them.
    #
    # `resolvectl` rather than `nmcli con mod`: the bridges are created with
    # `ip link add ... type bridge`, so NetworkManager does not manage them —
    # `nmcli device status` reports each one `connected (externally)`. A
    # profile with the bridge's name does exist in NM's store, but it is not
    # what puts the address on the device, and `nmcli con up` taking the
    # device over is untested. resolvectl works on the unmanaged device.
    #
    # Both the bridge and these addresses are runtime-only and lost on
    # reboot; see the NetworkManager-persistence note in docs/TODO.md.

    - name: Read each segment bridge's DNS servers
      ansible.builtin.command:
        cmd: "resolvectl dns {{ item.value.bridge }}"
      loop: "{{ lab_networks | dict2items }}"
      register: bridge_dns
      changed_when: false

    - name: Point each segment bridge's resolver at its own DNS server
      ansible.builtin.command:
        cmd: "resolvectl dns {{ item.item.value.bridge }} {{ item.item.value.dns }}"
      loop: "{{ bridge_dns.results }}"
      loop_control:
        label: "{{ item.item.key }} ({{ item.item.value.bridge }})"
      when:
        - item.item.value.dns is defined
        - item.item.value.dns not in item.stdout

    # ------------------------------------------------------------
    # VXLAN: one overlay per segment that declares a vxlan_id
    # ------------------------------------------------------------
    # Two rules, both load-bearing:
    #
    #   1. One VXLAN per segment, each enslaved to ITS OWN bridge. Enslaving
    #      two bridges to one VXLAN would merge their L2 domains and silently
    #      undo the segmentation.
    #   2. The interface name is DERIVED from the id (`vxlan<id>`), so it
    #      cannot drift from the VNI it carries. `vxlan_name` used to be a
    #      separate knob, and lab.yaml and the vault had already disagreed
    #      about it.
    #
    # With host_b commented out there are no peers, so `vxlan_remote_ip` is
    # "" and every task here is skipped - exactly as before. More than two
    # hosts needs a full mesh of FDB entries; `vxlan_peers` carries the list
    # for when that work happens.

    - name: Create each segment's VXLAN interface
      ansible.builtin.command:
        cmd: >-
          ip link add "vxlan{{ item.value.vxlan_id }}"
          type vxlan
          id "{{ item.value.vxlan_id }}"
          local "{{ ansible_host }}"
          remote "{{ vxlan_remote_ip }}"
          dev "{{ vxlan_parent_interface }}"
          dstport "{{ vxlan_port }}"
      loop: "{{ lab_networks | dict2items | selectattr('value.vxlan_id', 'defined') | list }}"
      loop_control:
        label: "vxlan{{ item.value.vxlan_id }} for {{ item.key }}"
      when:
        - vxlan_remote_ip | length > 0
        - ('vxlan' ~ item.value.vxlan_id) not in host_links.stdout | from_json | map(attribute='ifname')

    - name: Re-read the host's links
      ansible.builtin.command:
        cmd: ip -j link show
      register: host_links
      changed_when: false

    - name: Attach each segment's VXLAN to its own bridge
      ansible.builtin.command:
        cmd: "ip link set dev vxlan{{ item.value.vxlan_id }} master {{ item.value.bridge }}"
      loop: "{{ lab_networks | dict2items | selectattr('value.vxlan_id', 'defined') | list }}"
      loop_control:
        label: "vxlan{{ item.value.vxlan_id }} -> {{ item.value.bridge }}"
      when:
        - vxlan_remote_ip | length > 0
        - ('vxlan' ~ item.value.vxlan_id) in host_links.stdout | from_json | map(attribute='ifname')
        - item.value.bridge != (host_links.stdout | from_json
                                | selectattr('ifname', 'equalto', 'vxlan' ~ item.value.vxlan_id)
                                | first).master | default('')

    - name: Bring each segment's VXLAN interface up
      ansible.builtin.command:
        cmd: "ip link set dev vxlan{{ item.value.vxlan_id }} up"
      loop: "{{ lab_networks | dict2items | selectattr('value.vxlan_id', 'defined') | list }}"
      loop_control:
        label: "vxlan{{ item.value.vxlan_id }}"
      when:
        - vxlan_remote_ip | length > 0
        - ('vxlan' ~ item.value.vxlan_id) in host_links.stdout | from_json | map(attribute='ifname')
        - >-
          'UP' not in (host_links.stdout | from_json
                       | selectattr('ifname', 'equalto', 'vxlan' ~ item.value.vxlan_id)
                       | first).flags
