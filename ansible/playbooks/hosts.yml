---
- name: Configure hypervisor hosts
  hosts: hypervisors
  become: true

  vars:
    # Mirrored constant: OPNsense's LAN address, baked into the OPNsense
    # image. Same value as start_vms.yml's lab_dns_ip and dc.yml's
    # lab_dns_forwarder -- see the exceptions list in CLAUDE.md.
    lab_dns_ip: 10.0.0.1

  tasks:
    # ------------------------------------------------------------
    # Packages
    # ------------------------------------------------------------

    - name: Install libvirt and QEMU
      ansible.builtin.package:
        name:
          - libvirt
          - qemu-desktop
        state: present

    # ------------------------------------------------------------
    # libvirt
    # ------------------------------------------------------------

    - name: Enable and start libvirtd
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started

    # ------------------------------------------------------------
    # Linux bridge
    # ------------------------------------------------------------

    - name: Check whether bridge exists
      ansible.builtin.command:
        cmd: ip link show "{{ bridge_name }}"
      register: bridge_check
      changed_when: false
      failed_when: false

    - name: Create VM bridge
      ansible.builtin.command:
        cmd: ip link add name "{{ bridge_name }}" type bridge
      when: bridge_check.rc != 0

    - name: Check VM bridge state
      ansible.builtin.command:
        cmd: ip link show "{{ bridge_name }}"
      register: vm_bridge_state
      changed_when: false

    - name: Bring VM bridge up
      ansible.builtin.command:
        cmd: ip link set dev "{{ bridge_name }}" up
      when: "'state DOWN' in vm_bridge_state.stdout"

    - name: Check bridge addresses
      ansible.builtin.command:
        cmd: ip addr show dev "{{ bridge_name }}"
      register: bridge_addr
      changed_when: false

    - name: Add IP addr on vm-br0 link for monitoring (temp)
      ansible.builtin.command:
        cmd: ip addr add 10.0.0.2/24 dev "{{ bridge_name }}"
      when: "'10.0.0.2/24' not in bridge_addr.stdout"

    # ------------------------------------------------------------
    # DNS on the lab leg
    # ------------------------------------------------------------
    # The `clayface` zone is served by OPNsense (Unbound -> dnsmasq) on this
    # leg. The machine's other resolvers have never heard of it, so without
    # this the Ansible VM inventory cannot resolve its own `ansible_host`
    # (`<name>.<domain>` from terraform_vms.py) and every VM playbook dies
    # with NameResolutionError. Scoped to this link only: queries are asked
    # of OPNsense *in addition to* the normal resolvers, not instead of them.

    - name: Read the lab bridge's DNS servers
      ansible.builtin.command:
        cmd: resolvectl dns "{{ bridge_name }}"
      register: bridge_dns
      changed_when: false

    - name: Point the lab bridge's resolver at OPNsense
      ansible.builtin.command:
        cmd: resolvectl dns "{{ bridge_name }}" "{{ lab_dns_ip }}"
      when: lab_dns_ip not in bridge_dns.stdout

    # ------------------------------------------------------------
    # VXLAN
    # ------------------------------------------------------------

    - name: Check whether VXLAN interface exists
      ansible.builtin.command:
        cmd: ip link show "{{ vxlan_name }}"
      register: vxlan_check
      changed_when: false
      failed_when: false
      # No peer (single-host lab) -> no VXLAN to create. vxlan_remote_ip is
      # "" whenever lab.yaml defines fewer than two hosts, so uncommenting
      # host_b automatically brings the VXLAN to life on the next run.
      when: vxlan_remote_ip | length > 0

    - name: Create VXLAN interface
      ansible.builtin.command:
        cmd: >
          ip link add "{{ vxlan_name }}"
          type vxlan
          id "{{ vxlan_id }}"
          local "{{ ansible_host }}"
          remote "{{ vxlan_remote_ip }}"
          dev "{{ vxlan_parent_interface }}"
          dstport "{{ vxlan_port }}"
      when: vxlan_remote_ip | length > 0 and vxlan_check.rc != 0

    - name: Check VXLAN bridge membership
      ansible.builtin.command:
        cmd: bridge link show dev "{{ vxlan_name }}"
      register: vxlan_bridge
      changed_when: false
      failed_when: false
      when: vxlan_remote_ip | length > 0

    - name: Attach VXLAN to VM bridge
      ansible.builtin.command:
        cmd: ip link set dev "{{ vxlan_name }}" master "{{ bridge_name }}"
      when: vxlan_remote_ip | length > 0 and bridge_name not in vxlan_bridge.stdout

    - name: Check VXLAN state
      ansible.builtin.command:
        cmd: ip link show "{{ vxlan_name }}"
      register: vxlan_state
      changed_when: false
      when: vxlan_remote_ip | length > 0

    - name: Bring VXLAN interface up
      ansible.builtin.command:
        cmd: ip link set dev "{{ vxlan_name }}" up
      when: "vxlan_remote_ip | length > 0 and 'state DOWN' in vxlan_state.stdout"
