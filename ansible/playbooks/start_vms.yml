---
# Starts the VMs created by Terraform. VM names, hypervisor placement and the
# bridge each NIC sits on come from the terraform `vms` output, read by the
# dynamic inventory (inventory/terraform_vms.py) - which derived them from
# lab.yaml in the first place. Run it with both inventories:
#
#   ansible-playbook \
#       -i inventory/lab_inventory.py \
#       -i inventory/terraform_vms.py \
#       playbooks/start_vms.yml

# ------------------------------------------------------------
# Edge first: OPNsense provides DHCP/DNS for the whole lab
# ------------------------------------------------------------
- name: Start edge VMs (they provide DHCP/DNS for the lab)
  hosts: vms_gateway
  tags: gateway
  gather_facts: false

  vars:
    libvirt_uri: qemu:///system
    # The LAN segment's resolver, read from lab.yaml rather than repeated
    # here. The edge VM is what provides it, so this waits for OPNsense's own
    # LAN address to start answering.
    lab_dns_ip: "{{ lab_networks['lan']['dns'] }}"
    lab_dns_port: 53
    gateway_wait_timeout: 600

  pre_tasks:
    # Prechecked because `virsh start` on a domain whose bridge does not
    # exist fails with "Network bridge <name> not found" and leaves the
    # domain undefined and stopped. The edge VM is the only guest with more
    # than one leg, so it carries a list; everyone else has a single bridge.
    - name: Verify every bridge this VM attaches to exists on the hypervisor
      ansible.builtin.command:
        cmd: "ip link show {{ item }}"
      loop: "{{ libvirt_bridges | default([libvirt_bridge]) }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: bridge_check
      changed_when: false
      failed_when: false

    - name: Fail with a hint if a bridge is missing
      ansible.builtin.fail:
        msg: >-
          Bridge '{{ item.item }}' does not exist on {{ libvirt_hypervisor }}.
          Run 'ansible-playbook -i inventory/lab_inventory.py playbooks/hosts.yml'
          (it creates every segment bridge from lab.yaml) and
          'ansible-playbook -i inventory/lab_inventory.py playbooks/edge.yml'
          (it creates the WAN bridge), or use ./deploy.sh which runs
          everything in the right order.
      loop: "{{ bridge_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0

  tasks:
    - name: Get current domain state
      ansible.builtin.command:
        cmd: "virsh -c {{ libvirt_uri }} domstate {{ inventory_hostname }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: domain_state
      changed_when: false

    - name: Start VM
      ansible.builtin.command:
        cmd: "virsh -c {{ libvirt_uri }} start {{ inventory_hostname }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: vm_start
      when: domain_state.stdout | trim | lower != 'running'

    - name: Report VM status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} on {{ libvirt_hypervisor }}:
          {{ 'started' if vm_start is changed else 'already running' }}

    - name: Wait for the lab DNS to answer (DHCP/DNS ready)
      block:
        - name: Wait for DNS to listen
          ansible.builtin.wait_for:
            host: "{{ lab_dns_ip }}"
            port: "{{ lab_dns_port }}"
            timeout: "{{ gateway_wait_timeout }}"
          delegate_to: localhost
          run_once: true
      rescue:
        - name: Warn if DNS did not come up
          ansible.builtin.debug:
            msg: >-
              WARNING: DNS at {{ lab_dns_ip }}:{{ lab_dns_port }} was not reachable
              within {{ gateway_wait_timeout }}s. Continuing anyway - VMs will still
              boot and pick up DHCP leases later.

# ------------------------------------------------------------
# Then the rest of the lab
# ------------------------------------------------------------
- name: Start remaining VMs
  hosts: terraform_vms:!vms_gateway
  tags: members
  gather_facts: false

  vars:
    libvirt_uri: qemu:///system

  pre_tasks:
    - name: Verify every bridge this VM attaches to exists on the hypervisor
      ansible.builtin.command:
        cmd: "ip link show {{ item }}"
      loop: "{{ libvirt_bridges | default([libvirt_bridge]) }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: bridge_check
      changed_when: false
      failed_when: false

    - name: Fail with a hint if a bridge is missing
      ansible.builtin.fail:
        msg: >-
          Bridge '{{ item.item }}' does not exist on {{ libvirt_hypervisor }}.
          Run 'ansible-playbook -i inventory/lab_inventory.py playbooks/hosts.yml'
          (it creates every segment bridge from lab.yaml) and
          'ansible-playbook -i inventory/lab_inventory.py playbooks/edge.yml'
          (it creates the WAN bridge), or use ./deploy.sh which runs
          everything in the right order.
      loop: "{{ bridge_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0

  tasks:
    - name: Get current domain state
      ansible.builtin.command:
        cmd: "virsh -c {{ libvirt_uri }} domstate {{ inventory_hostname }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: domain_state
      changed_when: false

    - name: Start VM
      ansible.builtin.command:
        cmd: "virsh -c {{ libvirt_uri }} start {{ inventory_hostname }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: vm_start
      when: domain_state.stdout | trim | lower != 'running'

    - name: Report VM status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} on {{ libvirt_hypervisor }}:
          {{ 'started' if vm_start is changed else 'already running' }}

# ------------------------------------------------------------
# Final report
# ------------------------------------------------------------
- name: Report final VM states
  hosts: terraform_vms
  tags: members
  gather_facts: false

  vars:
    libvirt_uri: qemu:///system

  tasks:
    - name: Get domain state
      ansible.builtin.command:
        cmd: "virsh -c {{ libvirt_uri }} domstate {{ inventory_hostname }}"
      delegate_to: "{{ libvirt_hypervisor }}"
      register: final_state
      changed_when: false

    - name: Show domain state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} on {{ libvirt_hypervisor }} is {{ final_state.stdout | trim }}"
