---
# Workstation Group Policy: two GPOs, created and linked here, filled with
# registry-based content only.
#
# Design: docs/ad-identity-design.md section 7.
#
# REGISTRY POLICY ONLY — no GptTmpl.inf. Set-GPRegistryValue and the
# NetSecurity cmdlets both bump the GPO's version number, so clients notice
# the change. Hand-writing GptTmpl.inf into SYSVOL does not, and
# microsoft.ad has no security-policy cmdlet. The user rights and local group
# settings that would have gone in GptTmpl.inf are applied on the host by
# client.yml instead. See section 7.3 for the full reasoning and the trigger
# for revisiting it.

- name: Build the workstation Group Policy objects
  hosts: vms_dc
  gather_facts: false

  vars:
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('clayface', true) }}"
    lab_ad_domain: "{{ lab_domain }}.local"
    lab_ad_netbios: "{{ lab_domain | upper }}"
    ad_base_dn: "DC={{ lab_ad_domain | replace('.', ',DC=') }}"
    ad_anchor_dn: "OU={{ lab_ad.ou }},{{ ad_base_dn }}"

    gpo_baseline: "WS - Security Baseline"
    gpo_laps: "WS - LAPS"
    gpo_workstations_dn: "OU=Workstations,{{ ad_anchor_dn }}"

    # (key, name, type, value). DWord unless stated. Rendered into the GPO by
    # Set-GPRegistryValue, which bumps the GPO version so clients reapply.
    #
    # Deliberately absent: the Defender ASR rule 'Block credential stealing
    # from lsass.exe'. Enabling it breaks the primary attack path at weakness
    # W2. That is OMITTED HARDENING, not a planted weakness — a gap, not
    # something changed to create a scenario. See spec section 12.
    ws_registry_policy:
      - {key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: LmCompatibilityLevel,  value: 5}
      - {key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: NoLMHash,              value: 1}
      - {key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: RestrictAnonymousSAM,  value: 1}
      - {key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters',       name: RequireSecuritySignature, value: 1}
      - {key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters',  name: RequireSecuritySignature, value: 1}
      - {key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer',     name: NoDriveTypeAutoRun,       value: 255}
      - {key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System',       name: InactivityTimeoutSecs,    value: 900}
      - {key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System',       name: ConsentPromptBehaviorAdmin, value: 2}
      - {key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System',       name: ConsentPromptBehaviorUser,  value: 0}
      - {key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection', name: DisableRealtimeMonitoring, value: 0}
      - {key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\SpyNet',             name: SpynetReporting,          value: 2}
      - {key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\SpyNet',             name: SubmitSamplesConsent,     value: 2}
      - {key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender',                    name: PUAProtection,            value: 1}

    # The AD weakness toggles, from lab.yaml `ad.weaknesses`. `default({})` is
    # what makes a missing key read as "baseline"; the pre_task below is what
    # stops a typo'd key from doing the same thing silently.
    lab_ad_weak: "{{ (lab_ad | default({}, true)).weaknesses | default({}, true) }}"

    # The toggles THIS play implements — deliberately not the full seven. A
    # full list here would fail on, and warn about, toggles this play never
    # reads, which is a statement about a different playbook: W1/W3/W5/W6/W7
    # belong to ad.yml, W2's `excessive_local_admin` to client.yml.
    # ad_validate.yml asserts the union, so it is the play that carries the
    # union's list. This play owns W4 alone, because the GPO ACL is the whole
    # of what W4 changes.
    lab_ad_weak_keys:
      - weak_gpo_permission

  pre_tasks:
    # ------------------------------------------------------------
    # The contract with lab.yaml, before any GPO is created. `lab_ad_weak`
    # reads an absent key as "off", which is right for a toggle and wrong for
    # a typo, so a toggle this play implements that lab.yaml has dropped fails
    # here instead of being a silently disabled weakness. A key lab.yaml has
    # that no play knows is reported by ad_validate.yml, whose list is the
    # union.
    # ------------------------------------------------------------
    - name: Fail if lab.yaml's `ad.weaknesses` is unusable
      ansible.builtin.assert:
        that:
          - lab_ad_weak | length > 0
          - lab_ad_weak_keys | reject('in', lab_ad_weak) | list | length == 0
        fail_msg: >-
          lab.yaml has no `ad.weaknesses` map (or it is empty), or it does not
          declare {{ lab_ad_weak_keys | reject('in', lab_ad_weak) | join(', ') }},
          which this play implements. The seven toggles are static lab facts
          and belong in lab.yaml under `ad.weaknesses`, next to the users and
          groups they govern, not in this playbook — an absent toggle reads as
          `false`, so a dropped line is a silently disabled weakness. See
          docs/ad-identity-design.md section 13 for the list.

  tasks:
    # microsoft.ad.gpo manages LINKS ONLY — its own documentation says it
    # does not create or delete GPOs. So creation is New-GPO and linking is
    # the module.
    - name: Create the workstation GPOs
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module GroupPolicy
          $changed = @()
          foreach ($n in @('{{ gpo_baseline }}', '{{ gpo_laps }}')) {
              if (-not (Get-GPO -Name $n -ErrorAction SilentlyContinue)) {
                  New-GPO -Name $n `
                    -Comment 'Clayface lab — see docs/ad-identity-design.md' | Out-Null
                  $changed += $n
              }
          }
          if ($changed.Count -eq 0) { 'OK' }
          else { "CHANGED: $($changed -join '; ')" }
      register: gpo_create
      changed_when: "'CHANGED' in (gpo_create.output | join(' '))"

    - name: Link the GPOs to OU=Workstations
      microsoft.ad.gpo:
        name: "{{ item }}"
        target: "{{ gpo_workstations_dn }}"
        state: present
      loop:
        - "{{ gpo_baseline }}"
        - "{{ gpo_laps }}"

    - name: Verify both links resolve
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module GroupPolicy
          $links = (Get-GPInheritance -Target '{{ gpo_workstations_dn }}').GpoLinks
          $names = @($links | Select-Object -ExpandProperty DisplayName)
          foreach ($n in @('{{ gpo_baseline }}', '{{ gpo_laps }}')) {
              if ($names -notcontains $n) { throw "$n is not linked to {{ gpo_workstations_dn }}" }
          }
          "linked: $($names -join ', ')"
      register: gpo_links
      changed_when: false

    - name: Report the linked GPOs
      ansible.builtin.debug:
        msg: "{{ gpo_links.output | first }}"

    # ---------------------------------------------------------------
    # Firewall. -PolicyStore writes into the GPO's registry.pol and bumps
    # the GPO version, which is why this is safe where a hand-written
    # GptTmpl.inf would not be.
    # ---------------------------------------------------------------
    - name: Enable and configure the firewall profiles in the baseline
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $store = '{{ lab_ad_domain }}\{{ gpo_baseline }}'
          $want = @{
              Enabled               = 'True'
              DefaultInboundAction  = 'Block'
              DefaultOutboundAction = 'Allow'
              LogAllowed            = 'True'
              LogBlocked            = 'True'
          }

          # A GPO with no firewall settings yet returns nothing rather than
          # defaults, so "no profiles" is itself the drift signal.
          $cur = @(Get-NetFirewallProfile -PolicyStore $store `
                    -Name Domain,Private,Public -ErrorAction SilentlyContinue)
          $drift = @()
          if ($cur.Count -eq 0) { $drift += 'no firewall settings in the GPO' }
          else {
              foreach ($p in $cur) {
                  foreach ($k in $want.Keys) {
                      if ([string]$p.$k -ne $want[$k]) { $drift += "$($p.Name).$k" }
                  }
              }
          }
          if ($drift.Count -eq 0) { 'OK'; return }

          # AllowLocalFirewallRules is deliberately NOT set here. The base
          # image enables WinRM via `winrm quickconfig`, which creates LOCAL
          # rules; disabling local rule merging would remove Ansible's access
          # to every workstation.
          Set-NetFirewallProfile -PolicyStore $store -Name Domain,Private,Public `
              -Enabled True -DefaultInboundAction Block -DefaultOutboundAction Allow `
              -LogAllowed True -LogBlocked True
          "CHANGED: $($drift -join ', ')"
      register: fw_profiles
      changed_when: "'CHANGED' in (fw_profiles.output | join(' '))"

    # Explicit management-plane rule. The image's local WinRM rules would
    # probably cover this, but a firewall that blocks inbound by default plus
    # a management path that depends on an invisible local rule is a lab
    # that cannot be reached after one policy refresh.
    #
    # 10.0.0.0/24 is the LAN segment, and the DMZ is excluded on purpose: only
    # Windows VMs live here, none of them are in the DMZ, and a workstation in
    # the attacker's segment should not be able to open WinRM on its peers
    # whatever the policy store says. Widening this to 10.0.10.0/24 to "cover
    # the whole lab" would hand lateral movement a management channel.
    - name: Permit WinRM from the lab subnet
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $store = '{{ lab_ad_domain }}\{{ gpo_baseline }}'
          $name  = 'Lab WinRM (Ansible)'
          if (Get-NetFirewallRule -PolicyStore $store -DisplayName $name `
                -ErrorAction SilentlyContinue) { 'OK'; return }
          New-NetFirewallRule -PolicyStore $store -DisplayName $name `
              -Description 'Allow Ansible over WinRM from the lab subnet' `
              -Direction Inbound -Action Allow -Protocol TCP -LocalPort 5985 `
              -RemoteAddress 10.0.0.0/24 -Profile Any | Out-Null
          'CHANGED'
      register: fw_winrm
      changed_when: "'CHANGED' in (fw_winrm.output | join(' '))"

    # Read-compare-write per value. Keepers are deliberately skipped rather
    # than re-applied, so the task reports honestly whether anything moved.
    - name: Apply the registry hardening to the baseline GPO
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module GroupPolicy

          $gpo  = '{{ gpo_baseline }}'
          $key  = '{{ item.key }}'
          $name = '{{ item.name }}'
          $want = {{ item.value }}

          $cur = Get-GPRegistryValue -Name $gpo -Key $key -ValueName $name `
                   -ErrorAction SilentlyContinue
          if ($null -ne $cur -and $cur.Value -eq $want) { 'OK'; return }

          Set-GPRegistryValue -Name $gpo -Key $key -ValueName $name `
              -Type DWord -Value $want | Out-Null
          'CHANGED'
      loop: "{{ ws_registry_policy }}"
      loop_control:
        label: "{{ item.key }}\\{{ item.name }}"
      register: gpo_registry
      changed_when: "'CHANGED' in (gpo_registry.output | join(' '))"

    # The value list lives inside the task rather than in `vars`, because two
    # of the ten settings are built from `lab_ad` (the admin group and the
    # managed account name) and splitting them across two places invites
    # drift.
    #
    # AutomaticAccountManagement* makes LAPS create and enable its own
    # managed local account, so the built-in Administrator is never touched —
    # and built-in Administrator is the Ansible transport. Target 1 means
    # "use the configured custom account name"; 2 would hand LAPS the
    # built-in Administrator.
    - name: Apply the LAPS policy to the LAPS GPO
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module GroupPolicy

          $gpo = '{{ gpo_laps }}'
          $key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\LAPS'
          $changed = @()

          foreach ($item in @(
              @{ n = 'BackupDirectory';                         t = 'DWord';  v = 2 },
              @{ n = 'PasswordLength';                          t = 'DWord';  v = 20 },
              @{ n = 'PasswordComplexity';                      t = 'DWord';  v = 4 },
              @{ n = 'PasswordAgeDays';                         t = 'DWord';  v = 30 },
              @{ n = 'ADPasswordEncryptionEnabled';             t = 'DWord';  v = 1 },
              @{ n = 'AutomaticAccountManagementEnabled';       t = 'DWord';  v = 1 },
              @{ n = 'AutomaticAccountManagementTarget';        t = 'DWord';  v = 1 },
              @{ n = 'AutomaticAccountManagementEnableAccount'; t = 'DWord';  v = 1 },
              @{ n = 'ADPasswordEncryptionPrincipal';           t = 'String'; v = '{{ lab_ad_netbios }}\{{ lab_ad.workstation.admin_group }}' },
              @{ n = 'AutomaticAccountManagementNameOrPrefix';  t = 'String'; v = '{{ lab_ad.laps.managed_account }}' }
          )) {
              $cur = Get-GPRegistryValue -Name $gpo -Key $key -ValueName $item.n `
                       -ErrorAction SilentlyContinue
              if ($null -ne $cur -and [string]$cur.Value -eq [string]$item.v) { continue }
              Set-GPRegistryValue -Name $gpo -Key $key -ValueName $item.n `
                  -Type $item.t -Value $item.v | Out-Null
              $changed += $item.n
          }

          if ($changed.Count -eq 0) { 'OK' }
          else { "CHANGED: $($changed -join ', ')" }
      register: gpo_laps_policy
      changed_when: "'CHANGED' in (gpo_laps_policy.output | join(' '))"

    # --- DELIBERATE WEAKNESS: W4, weak_gpo_permission ---
    #
    # The all-employees group may edit the workstation security baseline — its
    # settings AND its security filtering. Because the GPO is linked to
    # OU=Workstations and applies to every workstation in the lab, the holder
    # can push an arbitrary startup script or a registry change to every
    # workstation at once, and can edit the ACL that decides who the policy
    # reaches. That is why this is a Domain-Admin-equivalent step rather than a
    # workstation-scoped one.
    #
    # Why a real organization has this: delegated GPO administration is a
    # documented practice, and the delegation is normally made to a role group
    # that has since grown to include everyone.
    #
    # PermissionLevel None removes the trustee's entry outright, which is what
    # makes the flag-off branch an active removal: the entry an earlier run
    # created is gone afterwards. The read guard means the None path is only
    # ever reached when an entry exists, so this cannot create a None entry on
    # a group that never had one.
    #
    # Domain Admins and the default SYSTEM/Enterprise Domain Controllers
    # entries are never touched: Set-GPPermission is called for one target,
    # the logon group, and for nothing else.
    - name: Set the GPO editing permission the logon group holds
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module GroupPolicy

          $gpo   = '{{ gpo_baseline }}'
          $who   = '{{ lab_ad.workstation.logon_group }}'
          $want  = [bool]${{ lab_ad_weak.weak_gpo_permission | bool | ternary('true', 'false') }}
          $level = if ($want) { 'GpoEditDeleteModifySecurity' } else { 'None' }

          $cur = Get-GPPermission -Name $gpo -TargetName $who -TargetType Group `
                   -ErrorAction SilentlyContinue
          $has = $false
          if ($null -ne $cur -and "$($cur.Permission)" -eq 'GpoEditDeleteModifySecurity') { $has = $true }
          if ($has -eq $want) { 'OK'; return }

          Set-GPPermission -Name $gpo -TargetName $who -TargetType Group `
              -PermissionLevel $level
          "CHANGED: $who on '$gpo' -> $level"
      register: gpo_perm_weak
      changed_when: "'CHANGED' in (gpo_perm_weak.output | join(' '))"
