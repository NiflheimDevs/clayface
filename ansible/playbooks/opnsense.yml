---
# What it does (idempotent):
#   1. detects the API scheme (https, falling back to http)
#   2. enables "Register DHCP leases" / "Register DHCP static mappings"
#   3. creates/updates one static DHCP binding per vms_pinned VM:
#        inventory name (from lab.yaml) + pinned MAC (terraform)
#        -> static IP (lab.yaml `ip:`), so <name>.clayface resolves from
#           boot #0
#   4. reconfigures dnsmasq and verifies the name resolves
#   5. OPTIONALLY hands out a DC as the lab's DNS server (DHCP option 6) —
#      off unless LAB_DHCP_DNS_SERVER is set, see the env overrides
#   6. OPTIONALLY publishes the application server to the WAN side with a
#      destination-NAT port forward — off unless LAB_WAN_EXPOSE_APP is set.
#
# Where the two halves of a binding come from:
#   - the MAC is terraform's, because the VM is created with it (each module
#     derives a deterministic MAC from the VM name — see modules/*/main.tf).
#     It has to be, since the guest's own hostname is random until a
#     playbook renames it.
#   - the IP is lab.yaml's, because it is a static fact about the lab, the
#     same as a hypervisor address or the bridge name.
#   This play only joins the two. It never deletes a row.
#
# With regdhcpstatic=1 a single dnsmasq host row carrying hwaddr is BOTH the
# DHCP reservation and the DNS A record — there is no second API call.
#
# Run (same inventories as every other playbook):
#   OPNSENSE_API_KEY=... OPNSENSE_API_SECRET=... \
#   ansible-playbook -i inventory/lab_inventory.py \
#                    -i inventory/terraform_vms.py playbooks/opnsense.yml
#
# Env overrides:
#   LAB_DNS_URL      full API base, e.g. https://10.0.0.1 (optional —
#                    otherwise the scheme is auto-detected on 10.0.0.1)
#   LAB_DOMAIN       lab DNS domain (default clayface)
#   LAB_DHCP_DNS_SERVER
#                    DNS server to hand to DHCP clients (option 6). UNSET by
#                    default. Enable it only AFTER a DC answers DNS: every
#                    lab VM would otherwise be pointed at a dead resolver.
#                    Recommended order: full deploy (dc.yml included, which
#                    sets the DC up as a resolver) -> confirm the DC's DNS
#                    verification passes -> re-run this play with the
#                    variable set. Recovery is deleting the option row and
#                    reconfiguring; IP connectivity is never lost.
#   LAB_WAN_EXPOSE_APP
#                    Empty (the default) = no port forward, app01 stays
#                    internal-only. Set it to the WAN port to forward, e.g.
#                    LAB_WAN_EXPOSE_APP=443, to also publish the portal on
#                    the OPNsense WAN address so an attacker outside the lab
#                    can reach it. Untested against a running OPNsense — read
#                    the section comment before enabling it.

- name: Pin VMs with a static address in OPNsense DHCP/DNS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opnsense_url_env: "{{ lookup('env', 'LAB_DNS_URL') }}"
    opnsense_host: "10.0.0.1"
    opnsense_url: "{{ (opnsense_url_env if opnsense_url_env | length > 0 else detected_scheme ~ '://' ~ opnsense_host) }}"
    opnsense_api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    opnsense_api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    lab_domain: "{{ lookup('env', 'LAB_DOMAIN') | default('clayface', true) }}"
    # DNS server handed to DHCP clients (dnsmasq option 6). EMPTY = disabled,
    # which is the default on purpose — see the bootstrap note in the header.
    # Set it to a DC's reserved IP (printed in the report at the end of this
    # play) once that DC actually answers DNS:
    #   LAB_DHCP_DNS_SERVER=10.0.0.10
    lab_dhcp_dns_server: "{{ lookup('env', 'LAB_DHCP_DNS_SERVER') | default('', true) }}"
    # WAN port to publish the portal on. EMPTY = disabled, which is the
    # default. See section 4d below before setting it.
    lab_wan_expose_app: "{{ lookup('env', 'LAB_WAN_EXPOSE_APP') | default('', true) }}"

  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ opnsense_api_key }}"
      url_password: "{{ opnsense_api_secret }}"
      force_basic_auth: true
      validate_certs: false # self-signed cert on the OPNsense image
      status_code: 200

  pre_tasks:
    - name: Fail early if API credentials are missing
      ansible.builtin.fail:
        msg: >-
          Set OPNSENSE_API_KEY and OPNSENSE_API_SECRET. Create them once in
          the OPNsense UI: System -> Access -> Users -> (admin user) ->
          add API key.
      when: not opnsense_api_key or not opnsense_api_secret

    # Both halves are collected here so one run reports every problem at
    # once. Why the pair is needed at all: see the fail message below.
    - name: Collect Windows VMs missing a pinned MAC or a static address
      ansible.builtin.set_fact:
        unpinned_windows: >-
          {{ (unpinned_windows | default([]))
             + ([item ~ '  ->  no pinned MAC; run terraform apply']
                if hostvars[item].libvirt_mac is not defined else [])
             + ([item ~ '  ->  no static IP; add `ip:` to vm_placements.' ~ item ~ ' in lab.yaml']
                if hostvars[item].libvirt_ip is not defined else []) }}
      loop: "{{ groups['vms_windows'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"

    - name: Fail if any Windows VM cannot be pinned
      ansible.builtin.fail:
        msg: |
          These Windows VMs cannot be given a DHCP reservation and DNS
          record, so Ansible will not be able to reach them:

          {% for problem in unpinned_windows %}  {{ problem }}
          {% endfor %}
          A Windows VM built from a sysprepped base boots with a random
          hostname (WIN-XXXXXXXXXXX), and dnsmasq registers whatever hostname
          the guest asks for — so <name>.clayface never resolves until the
          host has been renamed, and renaming it is what the playbook needs
          the connection for. The pinned MAC breaks that loop.
      when: unpinned_windows | default([]) | length > 0

    - name: Probe the OPNsense API over HTTPS
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/"
        status_code: [200, 302, 401]
        timeout: 3
      register: https_probe
      failed_when: false

    - name: Probe the OPNsense API over HTTP
      ansible.builtin.uri:
        url: "http://{{ opnsense_host }}/"
        status_code: [200, 302, 401]
        timeout: 3
      register: http_probe
      failed_when: false

    - name: Pick the answering scheme
      ansible.builtin.set_fact:
        detected_scheme: "{{ 'https' if https_probe.status == 200 else 'http' }}"

    - name: Verify OPNsense is reachable at all
      ansible.builtin.assert:
        that: https_probe.status == 200 or http_probe.status == 200
        fail_msg: >-
          Neither https://{{ opnsense_host }} nor http://{{ opnsense_host }}
          answered. Is the OPNsense VM running and reachable from this
          machine? (Override with LAB_DNS_URL if it lives elsewhere.)

  tasks:
    # ------------------------------------------------------------
    # 1. Read current dnsmasq configuration (also proves API access)
    # ------------------------------------------------------------
    - name: Read current dnsmasq configuration
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/get"
        method: GET
      register: dnsmasq_cfg

    - name: Verify API authentication works
      ansible.builtin.assert:
        that: dnsmasq_cfg.status == 200 and dnsmasq_cfg.json.dnsmasq is defined
        fail_msg: >-
          Could not read dnsmasq settings (HTTP {{ dnsmasq_cfg.status }}).
          Check OPNSENSE_API_KEY / OPNSENSE_API_SECRET.

    # ------------------------------------------------------------
    # 2. Enable DNS registration of leases + static mappings
    # ------------------------------------------------------------
    - name: Enable DNS registration of DHCP leases and static mappings
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/set"
        method: POST
        body_format: json
        body:
          dnsmasq:
            regdhcp: "1"
            regdhcpstatic: "1"
      register: cfg_set
      changed_when: >-
        (dnsmasq_cfg.json.dnsmasq.regdhcp | default('0') | string) != '1'
        or (dnsmasq_cfg.json.dnsmasq.regdhcpstatic | default('0') | string) != '1'

    # ------------------------------------------------------------
    # 3. Static bindings: one per vms_pinned VM
    # ------------------------------------------------------------
    - name: Search existing static bindings
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/searchHost"
        method: GET
      register: host_search

    - name: Index existing bindings by hostname
      ansible.builtin.set_fact:
        existing_by_name: "{{ dict(existing_rows | map(attribute='host') | zip(existing_rows)) }}"
      vars:
        existing_rows: "{{ host_search.json.rows | default([]) | selectattr('host', 'defined') | list }}"

    # Initialised before the loop so the list is always defined: with
    # nothing to pin the accumulating task below runs with loop: [] and does
    # nothing, instead of leaving wanted_bindings undefined for every task
    # that reads it.
    - name: Start with no wanted bindings
      ansible.builtin.set_fact:
        wanted_bindings: []

    - name: Compute the desired bindings (name -> pinned MAC -> static IP)
      ansible.builtin.set_fact:
        wanted_bindings: >-
          {{ wanted_bindings + [{
            'name': item,
            'mac': hostvars[item].libvirt_mac | upper,
            'ip': hostvars[item].libvirt_ip
          }] }}
      loop: "{{ groups['vms_pinned'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"

    - name: Create missing static bindings
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/addHost"
        method: POST
        body_format: json
        body:
          host:
            host: "{{ item.name }}"
            domain: "{{ lab_domain }}"
            ip: "{{ item.ip }}"
            hwaddr: "{{ item.mac }}"
            descr: "clayface lab (terraform/ansible managed)"
      loop: "{{ wanted_bindings }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.ip }} ({{ item.mac }})"
      register: binding_create
      when: item.name not in existing_by_name
      changed_when: binding_create.status == 200

    - name: Update stale static bindings (IP or MAC changed)
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/setHost/{{ existing_by_name[item.name].uuid }}"
        method: POST
        body_format: json
        body:
          host:
            host: "{{ item.name }}"
            domain: "{{ lab_domain }}"
            ip: "{{ item.ip }}"
            hwaddr: "{{ item.mac }}"
            descr: "clayface lab (terraform/ansible managed)"
      loop: "{{ wanted_bindings }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.ip }} ({{ item.mac }})"
      register: binding_update
      # Plain string comparison, not `search`: that treats the wanted IP as
      # a regex, where '.' matches any character — a stored 10.0.0.10 would
      # "match" a wanted 10.0.0.1 and the row would silently keep the wrong
      # address. Mirrors the hwaddr half, which was always exact.
      when: >-
        item.name in existing_by_name and (
          (existing_by_name[item.name].ip | default('', true) | string) != item.ip
          or (existing_by_name[item.name].hwaddr | default('', true) | string | lower) != (item.mac | lower))
      changed_when: binding_update.status == 200

    # ------------------------------------------------------------
    # 4. Apply + verify
    # ------------------------------------------------------------
    - name: Reconfigure dnsmasq (apply everything)
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/service/reconfigure"
        method: POST
      register: reconf
      changed_when: reconf.status == 200

    # ------------------------------------------------------------
    # 4b. Unbound -> dnsmasq forward for the lab domain.
    #     Unbound owns 10.0.0.1:53 in this image; the static bindings
    #     live in dnsmasq's DNS (auto-assigned port). Without this
    #     domain forward, everything above is invisible to clients.
    # ------------------------------------------------------------
    - name: Read dnsmasq's DNS port
      ansible.builtin.set_fact:
        dnsmasq_dns_port: "{{ dnsmasq_cfg.json.dnsmasq.dns_port | default('') }}"

    - name: Search existing Unbound domain forwards
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/unbound/settings/search_forward"
        method: GET
      register: forward_search

    - name: Find the forward for the lab domain
      ansible.builtin.set_fact:
        existing_forward: >-
          {{ forward_search.json.rows | default([])
            | selectattr('domain', '==', lab_domain) | list }}

    - name: Create the Unbound forward ({{ lab_domain }} -> dnsmasq on 127.0.0.1:{{ dnsmasq_dns_port }})
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/unbound/settings/add_forward"
        method: POST
        body_format: json
        # NOTE: body key is 'dot' (the model node), not 'forward' — the
        # endpoint is add_forward but addBase() expects the dots.dot node.
        body:
          dot:
            enabled: "1"
            type: "forward"
            domain: "{{ lab_domain }}"
            server: "127.0.0.1"
            port: "{{ dnsmasq_dns_port }}"
            description: "clayface lab (terraform/ansible managed)"
      register: forward_add
      changed_when: forward_add.status == 200
      when: existing_forward | length == 0

    - name: Update the Unbound forward (dnsmasq port changed)
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/unbound/settings/set_forward/{{ existing_forward[0].uuid }}"
        method: POST
        body_format: json
        body:
          dot:
            enabled: "1"
            type: "forward"
            domain: "{{ lab_domain }}"
            server: "127.0.0.1"
            port: "{{ dnsmasq_dns_port }}"
      register: forward_update
      changed_when: forward_update.status == 200
      when: >-
        existing_forward | length > 0 and (
          existing_forward[0].port | default('', true) | string != dnsmasq_dns_port | string
          or existing_forward[0].server | default('', true) | string != '127.0.0.1')

    - name: Reconfigure Unbound (apply the forward)
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/unbound/service/reconfigure"
        method: POST
      register: unbound_reconf
      changed_when: unbound_reconf.status == 200
      when: forward_add is changed or forward_update is changed

    # ------------------------------------------------------------
    # 4c. DHCP option 6 -> the lab resolver. OPT-IN: runs only when
    #     LAB_DHCP_DNS_SERVER is set (see the header).
    #
    #     Why opt-in: pointing every DHCP client at the DC before the
    #     DC answers DNS leaves the whole lab without a resolver. IP
    #     connectivity survives, so recovery is always possible
    #     (dc.yml -e ansible_host=<ip>), but every name lookup fails
    #     until it is reverted. The probe below turns that mistake into
    #     a loud failure instead of a silent blackhole.
    #
    #     dnsmasq's DHCP ranges have no DNS-server field; the mechanism
    #     is the generic dhcp-option=6,<ip>, exposed by OPNsense as a
    #     dhcp_options row. Same search/add/set shape as the static
    #     bindings above (UI: Services -> Dnsmasq DNS & DHCP ->
    #     DHCP options). Do NOT set `option6` on the row — the config
    #     template prefers it and would emit the IPv6 directive.
    # ------------------------------------------------------------
    - name: Probe the resolver we are about to hand out via DHCP
      ansible.builtin.command:
        cmd: "nslookup {{ lab_domain }} {{ lab_dhcp_dns_server }}"
      register: dns_option_probe
      changed_when: false
      failed_when: false
      when: lab_dhcp_dns_server | length > 0

    - name: Refuse to hand out a resolver that does not answer
      ansible.builtin.assert:
        that: dns_option_probe.rc == 0
        fail_msg: >-
          {{ lab_dhcp_dns_server }} did not answer a DNS query for
          {{ lab_domain }}. Handing it out via DHCP option 6 would leave every
          lab VM without a resolver. Promote the DC first (playbooks/dc.yml),
          or unset LAB_DHCP_DNS_SERVER.
        quiet: true
      when: lab_dhcp_dns_server | length > 0

    - name: Search existing dnsmasq DHCP options
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/searchOption"
        method: GET
      register: option_search
      when: lab_dhcp_dns_server | length > 0

    - name: Find the global option-6 row (untagged, no interface)
      ansible.builtin.set_fact:
        existing_option6: >-
          {{ option_search.json.rows | default([])
            | selectattr('option', 'defined')
            | selectattr('option', '==', '6')
            | rejectattr('tag', 'truthy')
            | rejectattr('interface', 'truthy')
            | list }}
      when: lab_dhcp_dns_server | length > 0

    - name: Hand out the lab resolver via DHCP option 6
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/addOption"
        method: POST
        body_format: json
        body:
          option:
            type: "set"
            option: "6"
            value: "{{ lab_dhcp_dns_server }}"
            description: "clayface lab (terraform/ansible managed)"
      register: option_add
      changed_when: option_add.status == 200
      when: lab_dhcp_dns_server | length > 0 and existing_option6 | length == 0

    - name: Update option 6 when the resolver changed
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/settings/setOption/{{ existing_option6[0].uuid }}"
        method: POST
        body_format: json
        body:
          option:
            type: "set"
            option: "6"
            value: "{{ lab_dhcp_dns_server }}"
            description: "clayface lab (terraform/ansible managed)"
      register: option_update
      changed_when: option_update.status == 200
      when: >-
        lab_dhcp_dns_server | length > 0 and existing_option6 | length > 0
        and (existing_option6[0].value | default('', true) | string) != lab_dhcp_dns_server

    - name: Reconfigure dnsmasq (apply the DHCP option)
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/dnsmasq/service/reconfigure"
        method: POST
      register: option_reconf
      changed_when: option_reconf.status == 200
      when: option_add is changed or option_update is changed

    # ------------------------------------------------------------
    # 4d. WAN port forward to the application server. OPT-IN: runs only
    #     when LAB_WAN_EXPOSE_APP is set (see the header).
    #
    #     Two things to know before enabling it:
    #       - searchRule only returns rules the API itself created. A rule
    #         made by hand in the GUI is invisible here, so this play cannot
    #         tell you a duplicate exists — it identifies its own rule by the
    #         descr marker below and only ever adds or updates that one. If
    #         you also made one in the GUI, delete one of them by hand.
    #       - it exposes the portal on the WAN address. In a home LAN that is
    #         the host's own network, which is the point of the exercise
    #         (the Ch5 engagement starts from outside), but it is a real
    #         change to the edge firewall and not something to leave on
    #         unattended.
    # ------------------------------------------------------------
    - name: Assert there is exactly one app VM to forward to
      ansible.builtin.assert:
        that:
          - groups['vms_app'] | default([]) | length == 1
          - hostvars[groups['vms_app'][0]].libvirt_ip is defined
        fail_msg: >-
          LAB_WAN_EXPOSE_APP is set, so a port forward needs one application
          VM with a static address — found
          {{ groups['vms_app'] | default([]) | length }} in vms_app. Add
          `ip:` to its entry in lab.yaml `vm_placements` and apply terraform.
        quiet: true
      when: lab_wan_expose_app | length > 0

    - name: Read the app VM's static address
      ansible.builtin.set_fact:
        lab_app_ip: "{{ hostvars[groups['vms_app'][0]].libvirt_ip }}"
      when: lab_wan_expose_app | length > 0

    - name: Search the existing Destination NAT rules
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/firewall/d_nat/searchRule"
        method: GET
      register: dnat_search
      when: lab_wan_expose_app | length > 0

    # Matched on the marker rather than on the port: a hand-made rule for the
    # same port is invisible to searchRule (see above), so matching on the
    # port would silently adopt or fight with it.
    - name: Find our own port-forward rule
      ansible.builtin.set_fact:
        existing_dnat: >-
          {{ dnat_search.json.rows | default([])
            | selectattr('descr', 'defined')
            | selectattr('descr', 'equalto', 'clayface lab portal (terraform/ansible managed)')
            | list }}
      when: lab_wan_expose_app | length > 0

    - name: Create the port forward (WAN -> the app VM)
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/firewall/d_nat/addRule"
        method: POST
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "1"
            interface: "wan"
            ipprotocol: "inet"
            protocol: "tcp"
            source:
              any: "1"
            destination:
              network: "any"
              port: "{{ lab_wan_expose_app }}"
            target: "{{ lab_app_ip }}"
            local-port: "{{ lab_wan_expose_app }}"
            natreflection: "purenat"
            log: "0"
            descr: "clayface lab portal (terraform/ansible managed)"
      register: dnat_add
      changed_when: dnat_add.status == 200
      when: lab_wan_expose_app | length > 0 and existing_dnat | length == 0

    - name: Update the port forward when the port or target changed
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/firewall/d_nat/setRule/{{ existing_dnat[0].uuid }}"
        method: POST
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "{{ existing_dnat[0].sequence | default('1') }}"
            interface: "wan"
            ipprotocol: "inet"
            protocol: "tcp"
            source:
              any: "1"
            destination:
              network: "any"
              port: "{{ lab_wan_expose_app }}"
            target: "{{ lab_app_ip }}"
            local-port: "{{ lab_wan_expose_app }}"
            natreflection: "purenat"
            log: "0"
            descr: "clayface lab portal (terraform/ansible managed)"
      register: dnat_update
      changed_when: dnat_update.status == 200
      when: >-
        lab_wan_expose_app | length > 0 and existing_dnat | length > 0
        and ((existing_dnat[0].target | default('', true) | string) != lab_app_ip
             or (existing_dnat[0]['local-port'] | default('', true) | string) != lab_wan_expose_app)

    - name: Apply the firewall rules
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/firewall/filter/apply"
        method: POST
      register: filter_apply
      changed_when: filter_apply.status == 200
      when: dnat_add is changed or dnat_update is changed

    - name: Report the port forward
      ansible.builtin.debug:
        msg: >-
          {{ 'Not publishing the portal: LAB_WAN_EXPOSE_APP is unset.' if lab_wan_expose_app | length == 0 else
             'Portal published on the OPNsense WAN address, port ' ~ lab_wan_expose_app
             ~ ' -> ' ~ lab_app_ip ~ ':' ~ lab_wan_expose_app ~ '. UNVERIFIED rule: '
             ~ 'check it in the OPNsense UI under Firewall -> NAT -> Destination NAT.' }}

    - name: Verify every pinned name resolves via OPNsense
      ansible.builtin.command:
        cmd: "nslookup {{ item.name | lower }}.{{ lab_domain }} {{ opnsense_host }}"
      loop: "{{ wanted_bindings }}"
      loop_control:
        label: "{{ item.name }}.{{ lab_domain }}"
      register: dns_check
      changed_when: false
      failed_when: dns_check.rc != 0

    - name: Report the bindings
      ansible.builtin.debug:
        msg: >-
          {{ 'No VMs to pin: nothing in lab.yaml carries both an `ip:` and a MAC-pinning module.' if wanted_bindings | length == 0 else
             'Pinned: ' ~ (wanted_bindings | map(attribute='name') | join(', '))
             ~ ' — resolves via ' ~ opnsense_host ~ ' as '
             ~ (wanted_bindings | map(attribute='name') | map('lower') | join(', '))
             ~ '.' ~ lab_domain ~ '.' }}
