# ============================================================
# IMPORTANT ARCHITECTURAL DECISIONS
# ============================================================

decisions:
  - id: AD_is_core

    decision: >
      Active Directory is a core component of Clayface.

    reason: >
      AD provides realistic enterprise identity, Kerberos, LDAP,
      Windows authentication, authorization, and many lateral
      movement and privilege-escalation attack paths.

  - id: AD_CS_is_optional

    decision: >
      Active Directory Certificate Services is not part of the core.

    reason: >
      AD CS enables valuable certificate-based attack paths but
      adds significant complexity and is only required for certain
      attack scenarios.

  - id: PostgreSQL_is_containerized

    decision: >
      PostgreSQL runs as a container on APP01 instead of having
      a dedicated database VM.

    reason: >
      This reduces infrastructure weight while making database
      versions and configurations easier to reproduce.

  - id: applications_are_containerized

    decision: >
      Multiple logical applications should normally run as containers
      on APP01 instead of separate VMs.

    reason: >
      This provides service isolation and configurable software
      versions without multiplying VM count.

  - id: IDP01_is_core

    decision: >
      A modern identity provider is part of the core architecture.

    reason: >
      AD alone models traditional Windows enterprise identity.
      IDP01 adds modern application identity such as OIDC, OAuth2,
      SAML, SSO, and eventually MFA.

  - id: optional_modules_provide_breadth

    decision: >
      Specialized infrastructure is implemented as optional modules.

    reason: >
      A single topology cannot realistically cover every offensive
      security technique without becoming unnecessarily heavy.

  - id: YAML_is_source_of_truth

    decision: >
      YAML is the primary human-editable project definition.

    reason: >
      YAML is readable by humans and agents while remaining suitable
      for automation.

  - id: scenario_engine_is_deferred

    decision: >
      The scenario system is currently conceptual only.

    reason: >
      Core infrastructure and AD should be stabilized before designing
      a detailed scenario schema and execution engine.

# ============================================================
# NON-GOALS / CONSTRAINTS
# ============================================================

constraints:
  - Do_not_make_every_service_a_VM

  - Do_not_make_every_attack_technique_part_of_core

  - Do_not_build_the_detailed_scenario_engine_yet

  - Do_not_overcomplicate_the_base_lab

  - Do_not_hardcode_software_versions_when_they_should_be_configurable

  - Do_not_treat_AD_as_only_a_login_server

  - Do_not_conflate_network_topology_with_authentication_graph

  - Do_not_conflate_authentication_with_authorization

  - Do_not_conflate_authorization_with_attack_paths

# ============================================================
# AGENT GUIDANCE
# ============================================================

agent_guidance:
  big_picture: >
    Clayface is a programmable enterprise security laboratory.
    The VM/container substrate provides infrastructure. AD and IDP
    provide identity. Applications and databases provide realistic
    services. Optional modules add specialized attack surfaces.
    The eventual goal is to model relationships and attack paths
    as a programmable security graph.

  when_modifying_architecture:
    - preserve_lightweight_core

    - prefer_reusable_modules

    - prefer_containers_for_application_services

    - keep_software_versions_configurable

    - keep_security_state_separate_from_base_infrastructure

    - avoid_premature_scenario_engine_complexity

    - preserve_AD_as_core_identity_infrastructure

    - preserve_IDP01_as_modern_application_identity

  current_priority:
    - Active_Directory
    - DC01
    - CLIENT01
    - AD_users_and_groups
    - AD_permissions
    - AD_authentication
    - Kerberos
    - LDAP
    - Linux_AD_integration
    - PostgreSQL
    - IDP01
    - initial_attack_paths
