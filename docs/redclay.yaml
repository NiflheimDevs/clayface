# ============================================================
# Clayface - Project Knowledge Base
# ============================================================
#
# Purpose:
#   Durable, agent-readable context for the Clayface project.
#
# Clayface is an Enterprise Digital Twin / red-team simulation
# playground focused on realistic but lightweight infrastructure.
#
# NOTE ON SOURCES OF TRUTH:
#   This file describes project INTENT: goals, architecture,
#   decisions, and agent guidance. Machine-consumed FACTS
#   (hypervisor addresses, network settings, VM placements)
#   live in lab.yaml at the repo root — terraform and ansible
#   read lab.yaml directly. Do not duplicate lab.yaml facts
#   here; if this file contradicts lab.yaml or the code,
#   lab.yaml and the code win.
#
# ============================================================

project:
  name: Clayface
  type: enterprise_digital_twin

  description: >
    A lightweight, reproducible, programmable enterprise infrastructure
    and red-team simulation playground. It models realistic corporate
    networking, identity, applications, databases, and security attack
    paths while keeping the base deployment small and configurable.

  goals:
    - realistic enterprise infrastructure
    - broad ethical-security and offensive-security technique coverage
    - lightweight base deployment
    - reproducible infrastructure
    - infrastructure-as-code
    - automated provisioning and configuration
    - configurable software versions
    - configurable security states
    - cross-platform attack paths
    - eventual programmable security/attack graph

  current_phase: active_directory

# ============================================================
# ARCHITECTURE PRINCIPLES
# ============================================================

design_principles:
  - Keep the core lab lightweight.

  - Use optional modules when additional attack surfaces are required.

  - Prefer containers for application/database/service deployment
    instead of creating a VM for every individual service.

  - Keep infrastructure definition conceptually separate from
    security state.

  - Make software versions and configuration controllable so
    vulnerable versions and CVEs can be deliberately reproduced.

  - Prefer reusable infrastructure and security components over
    hardcoded labs.

  - Support custom security experiments eventually.

  - Do not prematurely implement a complex scenario engine.

  - Do not attempt to put every possible offensive-security technique
    into the core topology.

  - Use a core + optional modules architecture.

# ============================================================
# CORE TOPOLOGY
# ============================================================

core:
  nodes:
    - name: OPNsense
      type: firewall_router
      status: core

      responsibilities:
        - firewall
        - routing
        - NAT
        - DHCP
        - DNS
        - VPN
        - network_boundary

    - name: DC01
      type: windows_server
      status: core

      os:
        family: Windows Server

      responsibilities:
        - Active Directory Domain Services
        - enterprise_identity
        - Kerberos
        - LDAP
        - DNS
        - Windows_domain_authentication
        - users
        - groups
        - authorization
        - domain_policy

    - name: CLIENT01
      type: windows_workstation
      status: core

      responsibilities:
        - domain_joined_employee_workstation
        - employee_endpoint
        - Windows_initial_access_target
        - Windows_privilege_escalation_target
        - lateral_movement_target

    - name: APP01
      type: linux_server
      status: core

      os:
        distribution: Ubuntu
        release_policy: LTS

      responsibilities:
        - application_host
        - Docker_host
        - web_services
        - API_services
        - database_services
        - internal_services

      # What is actually deployed, as of the application-tier cycle. The
      # block above is intent; this is fact, and it is the part that goes
      # stale — see docs/app01-design.md for the full design.
      current_state:
        built: true
        provisioned_by:
          terraform_module: terraform/modules/app
          lab_yaml_key: app01
          playbook: ansible/playbooks/app.yml
          validator: ansible/playbooks/app_validate.yml
        address: 10.0.0.30
        containers:
          - nginx (TLS termination, the only published port)
          - portal (Go, the deliberately vulnerable application)
          - postgres (the portal's own database)
        not_yet:
          - DMZ segmentation (still on the flat vm-br0 L2)
          - IDP01-backed authentication (the portal carries a service
            account as a credential; it does not federate)

    - name: IDP01
      type: identity_provider
      status: core

      responsibilities:
        - modern_application_identity
        - OIDC
        - OAuth2
        - SAML
        - SSO
        - future_MFA

# ============================================================
# APP01 SERVICE MODEL
# ============================================================

app01:
  deployment_model: containers

  runtime:
    - Docker
    - Docker_Compose

  principle: >
    Multiple logical applications and services should normally run as
    containers on APP01 instead of requiring separate VMs.

  # The realized subset of `example_services` below. That list stays as
  # intent — it is the shape a future service should slot into — but these
  # three are what exists and what the attack scenarios target.
  current_services:
    - name: nginx
      type: reverse_proxy
      note: Terminates TLS with a self-signed certificate; the only
        container that publishes a host port.
    - name: portal
      type: web_application
      note: Go service. Deliberately vulnerable; the weakness toggles live
        in lab.yaml under app.weaknesses and are documented in
        docs/app01-design.md.
    - name: postgres
      type: database
      note: Container-local, not reachable from outside the app01 host.

  example_services:
    - name: public_portal
      type: web_application

    - name: API
      type: API_service

    - name: internal_admin
      type: web_application

    - name: PostgreSQL
      type: database

    - name: Redis
      type: cache_or_service

    - name: other_services
      type: configurable

  services_should_support_configuration:
    - software
    - version
    - container_image
    - configuration
    - exposed_ports
    - network_access
    - credentials
    - authentication
    - authorization
    - dependencies
    - vulnerability_state

# ============================================================
# DATABASE
# ============================================================

database:
  default:
    engine: PostgreSQL

    deployment:
      type: container
      host: APP01

    dedicated_database_VM: false

  rationale: >
    A dedicated DB VM adds infrastructure weight without being necessary.
    PostgreSQL as a container makes versions, configuration, and vulnerable
    deployments easier to control.

  future_optional_engines:
    - SQL_Server
    - other_database_engines

  future_reason_for_SQL_Server: >
    SQL Server can provide Windows-integrated authentication and
    Active Directory-related attack paths that PostgreSQL does not
    naturally reproduce.

# ============================================================
# IDENTITY ARCHITECTURE
# ============================================================

identity:
  traditional_enterprise_identity:
    provider: DC01

    technologies:
      - Active_Directory
      - Kerberos
      - LDAP
      - Windows_domain_authentication

  modern_application_identity:
    provider: IDP01

    technologies:
      - OIDC
      - OAuth2
      - SAML
      - SSO
      - MFA_future

  conceptual_relationships:
    - AD_provides_traditional_enterprise_identity

    - Windows_clients_authenticate_against_AD

    - Linux_services_can_integrate_with_AD_when_useful

    - IDP01_provides_modern_application_identity

    - web_applications_can_authenticate_through_IDP01

    - IDP01_can_integrate_with_AD

  conceptual_flow:
    - AD
    - IDP
    - web_applications

# ============================================================
# OPTIONAL MODULES
# ============================================================

optional_modules:
  - name: CLIENT02

    purpose:
      - second_workstation
      - workstation_to_workstation_lateral_movement
      - credential_reuse
      - RDP
      - WinRM
      - SMB
      - pivoting

  - name: FILE01

    purpose:
      - Windows_file_server
      - SMB
      - file_shares
      - NTLM
      - ACLs
      - file_discovery
      - lateral_movement
      - relay_related_attack_paths

  - name: CA01

    purpose:
      - Active_Directory_Certificate_Services
      - certificate_authentication
      - AD_CS_attack_paths
      - certificate_template_misconfiguration

    core: false

  - name: DC02

    purpose:
      - second_domain_controller
      - multi_DC_environment
      - AD_replication
      - multi_DC_attack_paths

  - name: MAIL01

    purpose:
      - email_infrastructure
      - phishing
      - credential_harvesting
      - malicious_links
      - malicious_attachments
      - mailbox_compromise
      - BEC_related_attack_paths

  - name: CONTAINER01

    purpose:
      - separate_container_host
      - Docker_attack_surface
      - container_misconfiguration
      - container_escape_related_attack_paths

    note: >
      APP01 already runs Docker. CONTAINER01 exists for scenarios
      where a separate container host is useful.

  - name: K8S

    purpose:
      - Kubernetes
      - container_orchestration
      - cluster_identity
      - cluster_permissions
      - Kubernetes_misconfiguration
      - Kubernetes_attack_paths

module_policy:
  core:
    - OPNsense
    - DC01
    - CLIENT01
    - APP01
    - IDP01

  optional:
    - CLIENT02
    - FILE01
    - CA01
    - DC02
    - MAIL01
    - CONTAINER01
    - K8S

  rule: >
    Optional modules should only be instantiated when the desired
    attack path or technique requires them.

# ============================================================
# NETWORKING
# ============================================================

networking:
  virtualization:
    host_os: Arch_Linux

    technology:
      - KVM
      - QEMU
      - libvirt

    distributed:
      enabled: true
      physical_hosts: multiple

  inter_host_network:
    technology: VXLAN

    purpose:
      - Layer_2_connectivity_between_physical_hosts
      - logical_single_network_across_hosts
      - VM_to_VM_connectivity_across_hosts

  virtual_network:
    architecture:
      - Linux_bridge
      - VXLAN
      - VM_interfaces

    router:
      - OPNsense

  opnsense:
    responsibilities:
      - gateway
      - DHCP
      - DNS
      - NAT
      - firewall
      - VPN

    current_DHCP_provider: OPNsense
    current_DNS_provider: OPNsense

    WAN:
      model: NAT

  conceptual_zones:
    - external
    - DMZ_or_application
    - internal

# ============================================================
# AUTOMATION
# ============================================================

automation:
  terraform:
    role:
      - infrastructure_as_code
      - VM_creation
      - VM_distribution
      - infrastructure_declaration

    provider:
      name: dmacvicar/terraform-provider-libvirt
      version_previously_used: "0.9.8"

    status: working

  ansible:
    role:
      - host_configuration
      - network_configuration
      - libvirt_configuration
      - VM_startup
      - post_provisioning_configuration

    status: working

  orchestration:
    current_flow:
      - Terraform_provisions_VMs
      - Ansible_configures_hosts
      - Ansible_starts_VMs
      - Ansible_performs_post_configuration
      - OPNsense_provides_DHCP
      - OPNsense_provides_DNS

    wrapper_script:
      exists: true
      purpose: >
        Automates the Terraform + Ansible provisioning workflow.

# ============================================================
# CONFIGURATION MODEL
# ============================================================

configuration:
  human_source_of_truth:
    format: YAML

  generated_formats:
    - JSON

  generated_visualizations:
    - Graphviz_DOT
    - SVG

  conceptual_layers:
    infrastructure:
      question: "What exists?"

      includes:
        - physical_hosts
        - VMs
        - networks
        - bridges
        - containers
        - services
        - ports
        - software
        - software_versions

    security_state:
      question: "How is it configured from a security perspective?"

      includes:
        - users
        - groups
        - credentials
        - permissions
        - ACLs
        - authentication
        - authorization
        - trust_relationships
        - intentional_misconfigurations
        - vulnerable_versions
        - CVE_related_states

    relationships:
      includes:
        - network_relationships
        - authentication_relationships
        - authorization_relationships
        - service_dependencies
        - trust_relationships
        - attack_paths

  important_rule: >
    Infrastructure and security state should be conceptually separate.
    The same infrastructure should be able to run with different
    security configurations.

# ============================================================
# SCENARIO SYSTEM
# ============================================================

scenarios:
  status: conceptual_only

  implementation: deferred

  definition: >
    A scenario is a reproducible security situation or attack experiment
    that creates an intended attack path.

  it_is_not: >
    Merely a collection of boolean vulnerability or misconfiguration flags.

  future_requirements:
    - built_in_scenarios
    - custom_user_defined_scenarios
    - reusable_security_conditions
    - configurable_software_versions
    - configurable_credentials
    - configurable_permissions
    - configurable_service_exposure
    - configurable_authentication
    - configurable_authorization

  conceptual_examples:
    - SQL_injection_to_database
    - credential_compromise_to_VPN_to_CLIENT01
    - public_web_compromise_to_APP01
    - Kerberoasting
    - AD_CS_attack_path
    - credential_reuse
    - container_misconfiguration

  current_rule: >
    Do not implement the detailed scenario schema or scenario execution
    engine yet. Keep the concept available for future architecture.

# ============================================================
# ATTACK SURFACE
# ============================================================

attack_surface:
  primary_entry_points:
    - name: compromised_employee_credentials

      conceptual_path:
        - attacker
        - employee_credentials
        - VPN
        - internal_network
        - CLIENT01
        - Active_Directory

    - name: public_web_service

      conceptual_path:
        - internet
        - OPNsense
        - HTTPS
        - APP01
        - vulnerable_web_or_API_container
        - database_or_host_or_identity

  important_attack_paths:
    - credential_compromise_to_VPN_to_CLIENT01_to_AD

    - public_web_vulnerability_to_APP01

    - APP01_to_PostgreSQL

    - APP01_to_AD_using_service_identity

    - CLIENT01_to_AD_enumeration

    - CLIENT01_to_AD_privilege_escalation

    - cross_platform_APP01_to_database_to_credentials_to_AD

    - future_web_to_IDP_to_AD

    - future_container_misconfiguration_to_APP01_host

    - future_AD_CS_certificate_authentication

    - future_SMB_NTLM_RDP_WinRM_lateral_movement

# ============================================================
# TECHNIQUE COVERAGE
# ============================================================

technique_coverage:
  core_supports_well:
    - network_scanning
    - VPN_initial_access
    - web_exploitation
    - API_attacks
    - SQL_injection
    - database_attacks
    - Linux_privilege_escalation
    - Windows_privilege_escalation
    - Active_Directory_enumeration
    - Kerberos_attacks
    - LDAP_enumeration
    - credential_attacks
    - password_spraying
    - Kerberoasting
    - AS_REP_roasting
    - OIDC
    - OAuth2
    - SSO_related_attacks

  optional_modules_expand:
    SMB_NTLM_relay:
      module: FILE01

    file_share_attacks:
      module: FILE01

    workstation_lateral_movement:
      module: CLIENT02

    AD_CS_attacks:
      module: CA01

    multi_DC_attacks:
      module: DC02

    phishing:
      module: MAIL01

    mailbox_compromise:
      module: MAIL01

    container_escape:
      module: CONTAINER01

    Kubernetes_attacks:
      module: K8S

  outside_core_domain:
    - cloud_specific_attacks
    - wireless_specific_attacks
    - some_enterprise_monitoring_scenarios
    - specialized_physical_infrastructure

  important_note: >
    "All attack techniques" is not treated as a literal requirement for
    one topology. The architecture instead aims for broad coverage
    through a lightweight core and modular extensions.

# ============================================================
# GRAPH MODEL
# ============================================================

graphs:
  principle: >
    Network topology, authentication relationships, authorization
    relationships, and attack paths are different graphs and should
    not be conflated into one diagram.

  network_graph:
    represents:
      - hosts
      - networks
      - interfaces
      - routes
      - exposed_services
      - network_boundaries

  authentication_graph:
    represents:
      - users
      - identity_providers
      - authentication_protocols
      - trust_relationships

  authorization_graph:
    represents:
      - users
      - groups
      - service_accounts
      - resources
      - permissions
      - ACLs

  attack_graph:
    represents:
      - initial_access
      - vulnerabilities
      - credentials
      - trust_edges
      - privilege_edges
      - lateral_movement
      - reachable_targets

