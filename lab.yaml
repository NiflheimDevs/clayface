# lab.yaml — single source of truth for the lab.
#
# Static facts about the physical world live HERE, not in terraform
# variables, not in ansible inventories. Both tools read this file:
#
#   - terraform:  locals (see terraform/locals.tf) via yamldecode()
#   - ansible:   inventory/lab_inventory.py (dynamic inventory)
#
# What belongs here: hypervisor addresses/users, the single edge host, the
# network segments, and the VM placement map (which VM runs on which host,
# built from which terraform module).
hosts:
  host_a:
    address: 192.168.1.161
    user: kiasoh

  # host_b:
  #   address: 192.168.1.134
  #   user: kiasoh

edge:
  host: host_a

# Network segments, one entry per L2 domain. Read by terraform
# (locals.tf -> each module's `bridge` variable) and by Ansible
# (inventory/lab_inventory.py -> `lab_networks` on every host).
#
# `bridge` is the only required key: the WAN leg is a NAT leg with no subnet,
# no gateway and no overlay. The rest earn their place by displacing a literal
# that used to live in a playbook — `subnet` the 10.0.0.0/24 written in prose
# across four documents, `monitor` the control node's address in hosts.yml,
# `dns` four copies of OPNsense's address.
#
# `vxlan_id` is what makes a segment an overlay: declaring one is the
# statement that this leg is carried between hosts. A segment without one is
# host-local by definition, which is what makes `wan` self-describing.
networks:
  lan:
    bridge: vm-lan0
    subnet: 10.0.0.0/24
    gateway: 10.0.0.1
    dns: 10.0.0.1                 # OPNsense Unbound, on this leg
    monitor: 10.0.0.2/24          # the control node's address on this leg
    vxlan_id: 100
  dmz:
    bridge: vm-dmz0
    subnet: 10.0.10.0/24
    gateway: 10.0.10.1
    dns: 10.0.10.1
    monitor: 10.0.10.2/24
    vxlan_id: 101

    # The dynamic pool dnsmasq serves on this leg. Needed because a guest
    # whose MAC has no reservation gets *nothing* otherwise, and because the
    # range is what makes dnsmasq serve DHCP here at all. app01 is not in it:
    # it has a reservation (its `ip:` above, joined to terraform's pinned MAC
    # by opnsense.yml). `subnet_mask` is deliberately not repeated — dnsmasq
    # takes it from the interface address, and a second copy could only
    # disagree with `subnet`.
    dhcp_start: 10.0.10.100
    dhcp_end: 10.0.10.200

    # THE BOUNDARY, as data. Every pass rule the DMZ firewall gets, and
    # nothing else: anything not listed here is denied by the default-deny
    # that follows these rules, and the two logged deny rules the playbook
    # adds make an attempted pivot visible rather than silent.
    #
    # It lives here, rather than inside the playbook, because "what may the
    # zone the attacker lands in reach?" is the single most consequential
    # decision in this wave. As a lab.yaml list it is a diff a supervisor can
    # read; buried in Ansible it would only be discoverable by reading a
    # playbook. `app.weaknesses` is the same pattern: a design decision
    # expressed as data, read by a playbook, asserted by a validator.
    #
    # The first entry is the deliberate allowance and it is load-bearing: the
    # documented Chapter 5 chain loots the svc-idp-ldap credential out of the
    # portal database and binds to LDAP on dc01 with it. app01 is not
    # domain-joined, so that bind is the only pivot there is. Deny it and the
    # chain dies. It stays narrow (a bind on 389/636, not a forest search —
    # 3268/3269 are closed, and that difference is noticed by an attacker and
    # intended by the design), and it is logged.
    #
    # `ports:` is a list, but a firewall rule carries exactly one port (or one
    # range, or an alias — never a list), so an entry naming several becomes
    # several rules. The firewall's rule count is therefore not this list's
    # length; opnsense_dmz.yml has the long version.
    allow:
      - descr: LDAP bind to the domain controller (the documented pivot)
        proto: tcp
        ports: [389, 636]
        from: dmz
        to: 10.0.0.10
      - descr: DNS, so dc01.clayface resolves and the pivot is a hostname
        proto: tcp/udp
        ports: [53]
        from: dmz
        to: 10.0.10.1
      - descr: DHCP from the firewall's own DMZ address
        proto: udp
        ports: [67]
        from: dmz
        to: 10.0.10.1
      - descr: Internal users browsing the portal
        proto: tcp
        ports: [443]
        from: lan
        to: 10.0.10.10
  wan:
    bridge: vm-wan0               # NAT leg: no subnet, no gateway, no overlay

# Shared by every overlay, declared once. Both are properties of the host NIC
# and of the standard rather than of any one segment, which is why they stay
# top-level after `vxlan_id` moved under the segments above. The interface
# name is derived from the id (`vxlan<id>`), so it is deliberately not a knob
# here — a separate name could only ever disagree with the id it belongs to.
vxlan_port: 4789
vxlan_parent_interface: wlan0

# Remote-access VPN pool — DECLARED, NOT IMPLEMENTED.
#
# There is no VPN server anywhere in this lab. No WireGuard config exists, no
# OPNsense VPN instance is configured, and nothing answers on this range. This
# key exists so the pool the target topology describes has a home in the
# machine-read facts, and so no document can quietly imply the lab supports
# VPN initial access when it does not.
vpn:
  pool: 10.0.100.0/24
  server: none

# deployed on edge
edge_vm:
  name: opnsense01

# VM placement map for everything except the gateway: vm name ->
# { module: terraform module under terraform/modules/, host: hypervisor
# alias from `hosts` above, ip: optional static address, network: optional
# segment name from `networks` above }.
#
# `network:` defaults to `lan`, so only a VM that is deliberately placed
# somewhere else carries it. A typo'd value fails the terraform plan rather
# than silently putting the VM on no bridge (see the guard in locals.tf).
#
# `ip:` is what turns a VM into a DHCP reservation + DNS record in OPNsense
# (playbooks/opnsense.yml, driven by the module's pinned MAC). Required for
# any guest whose hostname is not baked into its image: dnsmasq registers
# the hostname the guest supplies in its DHCP request, and every Windows VM
# built from a sysprepped base boots as WIN-XXXXXXXXXXX. Without a
# reservation <name>.clayface never resolves, and the playbook that renames
# the guest cannot reach it to do the renaming.
vm_placements:
  dc01:
    module: dc
    host: host_a
    ip: 10.0.0.10
  client01:
    module: client
    host: host_a
    ip: 10.0.0.20
  app01:
    module: app
    host: host_a
    network: dmz
    ip: 10.0.10.10
  # alpine01:
  #   module: alpine
  #   host: host_a
  # alpine02:
  #   module: alpine
  #   host: host_b

# Active Directory identity (docs/ad-identity-design.md).
#
# The forest name is deliberately NOT here: dc.yml derives it from
# LAB_DOMAIN ("clayface" + ".local"), so a second knob could only ever
# disagree with it. These are the objects that live inside that forest.
#
# No passwords here either — LAB_USER_PASS comes from deploy.env.
ad:
  # Anchor OU under the domain root. Keeps lab objects out of the built-in
  # containers and gives the lab one link point that is not Default Domain
  # Policy.
  ou: Clayface

  # Child OUs, in creation order.
  ous:
    - Users
    - Groups
    - ServiceAccounts
    - Workstations

  groups:
    GG-Employees:
      description: All human employees. Authorizes interactive logon to workstations.
      # Role groups are employees too. Nesting keeps the interactive logon
      # right granted once, to one group, instead of once per role.
      nested: [GG-Developers, GG-IT-Admins]
    GG-Developers:
      description: Developer role. Maps to the app_developer role in IDP01.
    GG-IT-Admins:
      description: Workstation administrators. Local admin and LAPS read on workstations.

  users:
    ron.weas:
      ou: Users
      groups: [GG-Employees]
      description: Unprivileged employee. The baseline identity.
    bob.sing:
      ou: Users
      groups: [GG-Employees, GG-Developers]
      description: Employee and developer.
    abed.nad:
      ou: Users
      groups: [GG-Employees, GG-IT-Admins]
      description: IT admin and helpdesk.
    adm-hermione:
      ou: Users
      groups: [Domain Admins]
      description: Tier-0 administrator. Must never log on to a workstation.
      tier0: true
    svc-idp-ldap:
      ou: ServiceAccounts
      groups: []
      description: Directory bind account for IDP01. Read-only, scoped.
    svc-app-portal:
      ou: ServiceAccounts
      groups: []
      description: >-
        Service identity APP01's portal uses. No group memberships, so the
        account's own rights are the whole of its reach — see
        docs/app01-design.md, which plants its credential in the app config
        and in the portal database on purpose.
      # Name of the environment variable holding this account's password, so
      # it rotates separately from the human accounts. ad.yml reads it; when
      # it is unset the account falls back to LAB_USER_PASS like every other
      # user. playbooks/app.yml reads the same variable for the credential it
      # plants, which is what keeps the planted copy and the real one in
      # agreement.
      password_env: LAB_SVC_APP_PASS

  workstation:
    logon_group: GG-Employees
    admin_group: GG-IT-Admins
    # The account weakness W7 adds to the logon group. It is the portal's
    # service account: the credential the Chapter 5 chain recovers from the
    # portal database, and W7 is what makes that credential useful for
    # something beyond a bind — it is the step that moves the attacker from
    # the DMZ into the LAN, because the DMZ boundary allows tcp 389/636 to
    # dc01 and nothing else.
    #
    # Named here rather than inline in ad.yml because ad_validate.yml asserts
    # the same account, and a typo'd name in one place would be a silent
    # no-op in the other.
    weak_logon_member: svc-app-portal

  idp:
    bind_account: svc-idp-ldap
    # The OUs the bind account may read. Everything else is out of scope —
    # see the negative assertions in ad_validate.yml.
    read_ous: [Users, Groups]
    # The SPN weakness W1 gives this account (docs/ad-identity-design.md
    # section 13). Declared here rather than inline in ad.yml because the
    # validator asserts the same string, and two copies could disagree.
    #
    # The host names IDP01 because IDP01 is the service the account exists
    # for. IDP01 does not exist yet (roadmap Phase 5 adds it at
    # 10.0.0.30); nothing resolves an SPN by name, so the string is
    # forward-consistent rather than broken.
    spn: HTTP/idp01.clayface

  laps:
    managed_account: lapsadmin

  # Deliberate weakness toggles (docs/ad-identity-design.md section 13).
  # Read by ad.yml (W1/W3/W5/W6/W7), client.yml (W2) and ad_gpo.yml (W4);
  # asserted in both postures by ad_validate.yml. On is the lab's default
  # posture, matching `app.weaknesses`.
  weaknesses:
    kerberoastable_idp_bind: true
    excessive_local_admin: true
    excessive_laps_read: true
    weak_gpo_permission: true
    unconstrained_delegation: true
    excessive_idp_directory_permissions: true
    excessive_group_membership: true

# Application server (docs/app01-design.md).
#
# One VM running a containerised stack: nginx terminating TLS in front of a Go
# "Clayface Portal" service backed by PostgreSQL. Only nginx publishes host
# ports. The account named here is the AD service identity the portal carries;
# it is defined under ad.users above, and its password comes from
# LAB_SVC_APP_PASS.
#
# Keyed by role, not by VM name: like `ad` above, this is config for one tier
# of the lab, and the VM that serves it is named in vm_placements.app01.
app:
  service_account: svc-app-portal

  # Deliberate weakness toggles. Like ad.weaknesses above — all seven wired
  # and asserted in both postures — these default TRUE: the lab exists to be
  # attacked, and a portal with every weakness switched off is only useful as
  # the baseline half of a comparison. Each key is rendered into the
  # container's environment as WEAK_<KEY> by playbooks/app.yml, and
  # playbooks/app_validate.yml asserts each one both ways, so the map is the
  # toggle list, the env contract and the assertion list at once.
  #
  # Flipping one to false must produce a genuinely safe code path, not a
  # disabled route: that is what makes "baseline vs weakness" a real
  # comparison rather than a demo of an off switch.
  weaknesses:
    # Injection
    sqli_login: true
    sqli_search: true
    command_injection_diagnostics: true
    # Broken access control
    idor_documents: true
    broken_admin_authz: true
    path_traversal_download: true
    # Credential exposure
    hardcoded_db_credentials: true
    forgeable_session_token: true
    service_account_credential_in_db: true
    # Server-side extras
    ssrf_url_fetch: true
    verbose_errors_debug_endpoint: true

# Exfiltration targets for the Chapter 5 impact analysis (roadmap Phase 4).
#
# The engagement's last step is that the attacker takes something, and an
# impact claim with nothing to take is an assertion rather than a result. These
# are fake but realistic business files, planted beyond APP01's own seed.
#
# Placement is a static fact about the lab and lives here; the file CONTENT is
# prose and lives in playbooks/lab_data.yml, which is the same split app01
# uses — paths in lab.yaml, seed material beside the code that plants it.
#
# Shares are reachable from the LAN only. The baseline workstation GPO blocks
# inbound by default except for WinRM from 10.0.0.0/24, and dc01 is not in
# OU=Workstations so the GPO does not apply to it — the DC's own AD DS firewall
# rules permit 445, which is what makes \\dc01.clayface reachable from a
# workstation and a share on a workstation reachable only by someone already
# logged on to it.
data:
  shares:
    dc01:
      - name: Finance
        path: C:\Shares\Finance
        description: Finance department working files
    client01:
      - name: Projects
        path: C:\Shares\Projects
        description: Developer project files
