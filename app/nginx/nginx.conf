# nginx.conf — the Clayface Portal's front door.
#
# TLS terminates here and nowhere else. The portal itself speaks plain HTTP on
# the compose network, so that network is a trust boundary in the lab: anything
# that can join it can reach the portal, the API and the admin panel without
# going through a certificate or a redirect. nginx is what stands between the
# wider network and all three.
#
# This file is mounted read-only at /etc/nginx/nginx.conf, and the certificate
# at /etc/nginx/certs/ is generated on the VM by Ansible — no certificate and no
# private key is committed to the repository.
#
# Deliberate omission, and it is a deliberate one: there are no security
# headers here. No Strict-Transport-Security, no X-Content-Type-Options, no
# Content-Security-Policy, no X-Frame-Options. That is the server-side half of
# the WEAK_VERBOSE_ERRORS_DEBUG_ENDPOINT toggle's story — a hardened nginx would
# send at least HSTS and a content-type guard, and the absence is one of the
# misconfigurations the lab is built to demonstrate.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Somewhere for proxy errors to land. stdout and stderr are the container
    # log, which is where the rest of the stack's output goes.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # The certificate is self-signed, so there is nothing to chain and nothing
    # to verify; TLS 1.2 is the floor because anything older is not worth the
    # configuration.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Port 80 exists only to move traffic to 443. The permanent redirect is the
    # one piece of HTTP hygiene this deployment gets right, and it is what the
    # container healthcheck and a browser both depend on.
    server {
        listen      80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    server {
        listen              443 ssl;
        http2               on;
        server_name         _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # A single location for the whole application. The portal serves three
        # route groups on one listener, so there is nothing to split up here —
        # and deliberately no separate location for /admin, because giving the
        # admin panel its own access rule would be a control this deployment is
        # supposed to be missing.
        location / {
            proxy_pass http://portal:8080;

            # Host is preserved so that any absolute URL the application builds
            # points at the name the client actually used.
            proxy_set_header Host              $host;

            # X-Forwarded-For is appended to, not replaced: nginx adds the
            # address it sees, which is the real client. Note that $proxy_add_x_forwarded_for
            # keeps whatever the client sent in front of it — which is exactly
            # what makes the application's leftmost-value trust (see the
            # verbose-errors toggle) a spoofable audit field rather than a
            # reliable one.
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long enough for the diagnostics page, which waits on a ping.
            proxy_read_timeout 30s;
        }

        # The healthcheck path, proxied like everything else so that the nginx
        # container's own healthcheck exercises the whole chain: nginx, the
        # certificate, the proxy and the application.
        location = /healthz {
            proxy_pass http://portal:8080/healthz;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
